<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start Page Mobile — Gutschi.site</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Icon.jsx"></script>
<script type="text/babel" src="android-frame.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: sans-serif; background: #e8e8e8; display: flex; align-items: center; justify-content: center; }
  #root { height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const APPS = [
  { key: 'cash',      name: 'Cash',      icon: 'cash',      description: 'Bookkeeping' },
  { key: 'coeditor',  name: 'CoEditor',  icon: 'coeditor',  description: 'Document editor' },
  { key: 'admin',     name: 'Admin',     icon: 'admin',     description: 'Server admin' },
  { key: 'startpage', name: 'StartPage', icon: 'startpage', description: 'Browser start page' },
];

const BOOKMARKS = [
  { label: 'GitHub',   url: 'https://github.com' },
  { label: 'Outlook',  url: 'https://outlook.com' },
  { label: 'Scaleway', url: 'https://scaleway.com' },
  { label: 'OneDrive', url: 'https://onedrive.live.com' },
];

const WEATHER = { city: 'Zürich', temp: 17, condition: 'Partly cloudy' };

function useClock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);
  return now;
}

function fmtTime(d) {
  return d.toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit' });
}
function fmtDate(d) {
  return d.toLocaleDateString('de-AT', { weekday: 'long', day: 'numeric', month: 'long' });
}

function WeatherIcon({ size = 20 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 32 32" fill="none">
      <circle cx="12" cy="12" r="5" fill="rgba(0,0,220,0.7)" />
      <line x1="12" y1="4" x2="12" y2="2" stroke="rgba(0,0,220,0.7)" strokeWidth="1.5" strokeLinecap="round"/>
      <line x1="12" y1="22" x2="12" y2="20" stroke="rgba(0,0,220,0.7)" strokeWidth="1.5" strokeLinecap="round"/>
      <line x1="4" y1="12" x2="2" y2="12" stroke="rgba(0,0,220,0.7)" strokeWidth="1.5" strokeLinecap="round"/>
      <line x1="22" y1="12" x2="20" y2="12" stroke="rgba(0,0,220,0.7)" strokeWidth="1.5" strokeLinecap="round"/>
      <line x1="6.34" y1="6.34" x2="4.93" y2="4.93" stroke="rgba(0,0,220,0.7)" strokeWidth="1.5" strokeLinecap="round"/>
      <line x1="19.07" y1="19.07" x2="17.66" y2="17.66" stroke="rgba(0,0,220,0.7)" strokeWidth="1.5" strokeLinecap="round"/>
      <rect x="8" y="18" width="18" height="9" rx="4.5" fill="rgba(200,200,200,1)" />
      <rect x="13" y="15" width="10" height="8" rx="4" fill="rgba(200,200,200,1)" />
    </svg>
  );
}

function StartPageMobile() {
  const now = useClock();
  const [q, setQ] = useState('');

  function submitSearch(e) {
    e.preventDefault();
    if (q.trim()) window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, '_blank');
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', background: 'white', overflowY: 'auto' }}>
      {/* Slim blue bar */}
      <div style={{
        display: 'flex', alignItems: 'center',
        background: 'rgba(0,0,220,1)', color: 'white',
        height: '2.75rem', padding: '0 1rem', flexShrink: 0,
      }}>
        <span style={{ fontSize: '1rem', fontWeight: 600 }}>Homeserver</span>
        <div style={{ flexGrow: 1 }} />
        <a href="#" onClick={e => e.preventDefault()} title="Logout" style={{
          color: 'white', textDecoration: 'none',
          width: '2.75rem', height: '2.75rem', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
        }}
          onMouseEnter={e => e.currentTarget.style.background = 'rgba(0,0,255,1)'}
          onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path fillRule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/><path fillRule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/></svg>
        </a>
      </div>

      {/* Content */}
      <div style={{ flexGrow: 1, display: 'flex', flexDirection: 'column', padding: '1.25rem 1rem 1rem', minHeight: 0 }}>

        {/* Search */}
        <form onSubmit={submitSearch} style={{ display: 'flex', gap: '0.5rem', width: '100%', marginBottom: '1rem' }}>
          <input
            value={q} onChange={e => setQ(e.target.value)}
            placeholder="Search…"
            style={{
              flexGrow: 1, height: '2.75rem', fontSize: '1rem',
              border: '1px solid rgba(200,200,200,1)', borderRadius: '6px',
              padding: '0 0.75rem', fontFamily: 'sans-serif', outline: 'none',
            }}
            onFocus={e => e.target.style.borderColor = 'rgba(0,0,220,1)'}
            onBlur={e => e.target.style.borderColor = 'rgba(200,200,200,1)'}
          />
          <button type="submit" style={{
            height: '2.75rem', padding: '0 1rem', background: 'rgba(0,0,220,1)',
            color: 'white', border: '1px solid rgba(0,0,150,1)', borderRadius: '6px',
            cursor: 'pointer', fontSize: '0.9rem', fontFamily: 'sans-serif',
          }}>Search</button>
        </form>

        {/* App cards — fill remaining space */}
        <div style={{ flexGrow: 1, display: 'grid', gridTemplateColumns: '1fr', gap: '0.75rem', alignContent: 'stretch' }}>
          {APPS.map(app => (
            <a key={app.key} href="#" onClick={e => e.preventDefault()} style={{
              display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center',
              padding: '1rem 0.5rem',
              border: '1px solid rgba(200,200,200,1)', borderRadius: '6px',
              textDecoration: 'none', color: 'black', background: 'white',
              transition: 'background 0.15s',
            }}
              onMouseEnter={e => e.currentTarget.style.background = 'rgb(240,240,240)'}
              onMouseLeave={e => e.currentTarget.style.background = 'white'}>
              <Icon name={app.icon} style={{ width: '2.5rem', height: '2.5rem', marginBottom: '0.5rem' }} />
              <div style={{ fontWeight: 600, fontSize: '0.9rem' }}>{app.name}</div>
              <div style={{ fontSize: '0.75rem', color: '#777', marginTop: '0.15rem' }}>{app.description}</div>
            </a>
          ))}
        </div>

        {/* Bottom: bookmarks + weather fixed at bottom */}
        <div style={{ flexShrink: 0, marginTop: '1rem', display: 'flex', flexDirection: 'column', gap: '1rem' }}>
          {/* Bookmarks — 2-col grid */}
          <div style={{ marginBottom: '0.75rem' }}>
            <div style={{ fontSize: '0.7rem', fontWeight: 600, color: '#555', textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: '0.5rem' }}>Bookmarks</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '0.5rem' }}>
              {BOOKMARKS.map(b => (
                <a key={b.label} href={b.url} target="_blank" rel="noopener" style={{
                  display: 'block', padding: '0.6rem 0.75rem',
                  border: '1px solid rgba(200,200,200,1)', borderRadius: '6px',
                  textDecoration: 'none', color: '#333', fontSize: '0.875rem',
                  background: 'white', transition: 'background 0.15s',
                }}
                  onMouseEnter={e => e.currentTarget.style.background = 'rgb(240,240,240)'}
                  onMouseLeave={e => e.currentTarget.style.background = 'white'}>
                  {b.label}
                </a>
              ))}
            </div>
          </div>

          {/* Weather — centered on its own line */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '0.6rem', color: '#555', fontSize: '0.85rem' }}>
            <WeatherIcon size={20} />
            <span>{WEATHER.city} {WEATHER.temp}°C — {WEATHER.condition}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <AndroidDevice>
      <StartPageMobile />
    </AndroidDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
