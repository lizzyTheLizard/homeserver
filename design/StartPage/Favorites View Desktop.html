<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StartPage — Favorites — Gutschi.site</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../Icon.jsx"></script>
<script type="text/babel" src="../Components.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: sans-serif; background: white; }
  #root { height: 100%; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;

const HEADER_H = '4rem';

const INITIAL_FAVORITES = [
  { id: 1, position: 1, name: 'GitHub',    url: 'https://github.com',        description: 'Source code hosting' },
  { id: 2, position: 2, name: 'Outlook',   url: 'https://outlook.com',       description: 'Work email' },
  { id: 3, position: 3, name: 'Scaleway',  url: 'https://scaleway.com',      description: 'Cloud infrastructure' },
  { id: 4, position: 4, name: 'OneDrive',  url: 'https://onedrive.live.com', description: 'File storage' },
  { id: 5, position: 5, name: 'YouTube',   url: 'https://youtube.com',       description: '' },
  { id: 6, position: 6, name: 'Wikipedia', url: 'https://wikipedia.org',     description: 'Reference' },
];

const thStyle = {
  textAlign: 'left', padding: '0.5rem 0.75rem',
  borderBottom: '2px solid rgba(200,200,200,1)',
  fontWeight: 600, fontSize: '0.9rem',
  cursor: 'pointer', userSelect: 'none', whiteSpace: 'nowrap',
};
const tdStyle = {
  padding: '0.5rem 0.75rem',
  borderBottom: '1px solid rgba(200,200,200,1)',
  fontSize: '0.9rem', verticalAlign: 'top',
};

function SortIcon({ field, sort }) {
  const active = sort.field === field;
  const name = active ? (sort.dir === 'asc' ? 'up' : 'down') : 'updown';
  return (
    <Icon name={name} style={{
      display: 'inline-flex', width: '0.75rem', height: '0.75rem',
      verticalAlign: 'middle', marginLeft: '0.3rem',
      opacity: active ? 1 : 0.4,
    }} />
  );
}

function FavoritesSidebar({ mode, entry, onSave, onDelete, onClose }) {
  const [position, setPosition] = useState(entry ? String(entry.position) : '');
  const [name, setName]         = useState(entry ? entry.name             : '');
  const [url,  setUrl]          = useState(entry ? entry.url              : '');
  const [desc, setDesc]         = useState(entry ? entry.description      : '');
  const [confirmDel, setConfirmDel] = useState(false);

  const title = mode === 'new' ? 'New favorite' : 'Edit favorite';

  function handleSave() {
    if (!name.trim() || !url.trim()) return;
    onSave({ position: parseInt(position, 10) || 0, name: name.trim(), url: url.trim(), description: desc.trim() });
  }

  return (
    <div style={{
      width: '400px', flexShrink: 0,
      borderLeft: '2px solid rgba(0,0,220,0.25)',
      borderTop: '1px solid rgba(200,200,200,1)',
      borderBottom: '1px solid rgba(200,200,200,1)',
      marginLeft: '1rem',
      position: 'sticky', top: HEADER_H,
      height: `calc(100vh - ${HEADER_H})`,
      display: 'flex', flexDirection: 'column',
      overflow: 'hidden',
    }}>
      {/* Form area */}
      <div style={{ flexGrow: 1, padding: '1rem', display: 'flex', flexDirection: 'column', gap: '0.5rem', minHeight: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', marginBottom: '0.25rem', flexShrink: 0 }}>
          <h1 style={{ margin: 0, fontSize: '1.2rem', flexGrow: 1 }}>{title}</h1>
          <button onClick={onClose} style={{
            background: 'transparent', border: 'none', cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            width: '2.5rem', height: '2.5rem', borderRadius: '6px',
            color: '#333', flexShrink: 0, margin: '-0.25rem',
          }}
            onMouseEnter={e => e.currentTarget.style.background = 'rgb(240,240,240)'}
            onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
            <Icon name="close" style={{ width: '1.75rem', height: '1.75rem' }} />
          </button>
        </div>
        {entry && <p style={{ fontWeight: 600, flexShrink: 0 }}>{entry.name}</p>}

        <div style={{ flexShrink: 0 }}>
          <Input label="Position" value={position} onChange={e => setPosition(e.target.value)} type="number" />
        </div>
        <div style={{ flexShrink: 0 }}>
          <Input label="Name" value={name} onChange={e => setName(e.target.value)} />
        </div>
        <div style={{ flexShrink: 0 }}>
          <Input label="URL"  value={url}  onChange={e => setUrl(e.target.value)} />
        </div>

        {/* Description textarea — stretches */}
        <div style={{ flexGrow: 1, display: 'flex', flexDirection: 'column', position: 'relative', minHeight: 0 }}>
          <label style={{
            fontSize: '0.65rem', color: 'rgba(0,0,0,0.6)',
            position: 'absolute', left: '0.5rem', top: '0.25rem', pointerEvents: 'none', zIndex: 1,
          }}>Description</label>
          <textarea
            value={desc}
            onChange={e => setDesc(e.target.value)}
            style={{
              flexGrow: 1, width: '100%', resize: 'none',
              border: '1px solid rgba(200,200,200,1)', borderRadius: '6px',
              padding: '1.25rem 0.5rem 0.5rem',
              fontFamily: 'sans-serif', fontSize: '0.95rem', lineHeight: 1.5,
              outline: 'none',
            }}
            onFocus={e => e.target.style.background = 'rgba(0,0,220,0.04)'}
            onBlur={e => e.target.style.background = 'white'}
          />
        </div>
      </div>

      {/* Actions pinned to bottom */}
      <div style={{ flexShrink: 0, padding: '0.75rem 1rem', borderTop: '1px solid rgba(200,200,200,1)', display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
        {confirmDel ? (
          <>
            <div style={{
              padding: '0.75rem',
              border: '1px solid rgba(220,0,0,0.3)', borderRadius: '6px',
              background: 'rgba(220,0,0,0.05)', marginBottom: '0.25rem',
            }}>
              <p style={{ fontSize: '0.85rem', marginBottom: '0.5rem' }}>
                Delete <strong>{entry.name}</strong>? This cannot be undone.
              </p>
            </div>
            <Button variant="danger"    onClick={() => onDelete(entry.id)}>Confirm delete</Button>
            <Button variant="secondary" onClick={() => setConfirmDel(false)}>Cancel</Button>
          </>
        ) : (
          <>
            <Button variant="primary" onClick={handleSave}>Save</Button>
            {mode === 'edit' && <Button variant="danger" onClick={() => setConfirmDel(true)}>Delete</Button>}
          </>
        )}
      </div>
    </div>
  );
}

function App() {
  const [favorites, setFavorites] = useState(INITIAL_FAVORITES);
  const [sidebar, setSidebar] = useState(null);
  const [sort, setSort] = useState({ field: 'position', dir: 'asc' });
  const nextId = useRef(INITIAL_FAVORITES.length + 1);

  function toggleSort(field) {
    setSort(s => s.field === field
      ? { field, dir: s.dir === 'asc' ? 'desc' : 'asc' }
      : { field, dir: 'asc' }
    );
  }

  const sorted = [...favorites].sort((a, b) => {
    const av = sort.field === 'position' ? a.position : (a[sort.field] || '').toLowerCase();
    const bv = sort.field === 'position' ? b.position : (b[sort.field] || '').toLowerCase();
    if (av < bv) return sort.dir === 'asc' ? -1 : 1;
    if (av > bv) return sort.dir === 'asc' ?  1 : -1;
    return 0;
  });

  function handleSave(data) {
    if (sidebar.mode === 'new') {
      const id = nextId.current++;
      setFavorites(f => [...f, { id, ...data }]);
    } else {
      setFavorites(f => f.map(x => x.id === sidebar.entry.id ? { ...x, ...data } : x));
    }
    setSidebar(null);
  }

  function handleDelete(id) {
    setFavorites(f => f.filter(x => x.id !== id));
    setSidebar(null);
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
      <Header
        appName="StartPage"
        links={[{ href: '/startpage/favorites', text: 'Favorites' }]}
        currentPath="/startpage/favorites"
        onNavigate={() => {}}
        onLogout={() => {}}
      />

      <div style={{ display: 'flex', flexGrow: 1, padding: '0 1rem', alignItems: 'flex-start', minHeight: 0 }}>
        <main style={{ flexGrow: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', flexWrap: 'wrap' }}>
            <h1 style={{ flexGrow: 1, textAlign: 'left', marginTop: '1rem' }}>Favorites</h1>
            <Button variant="primary" onClick={() => setSidebar({ mode: 'new', entry: null })} style={{ width: 'auto' }}>
              Add favorite
            </Button>
          </div>

          <table style={{ width: '100%', borderCollapse: 'collapse', marginTop: '0.75rem' }}>
            <thead>
              <tr>
                <th style={{ ...thStyle, width: '5%' }} onClick={() => toggleSort('position')}>
                  # <SortIcon field="position" sort={sort} />
                </th>
                <th style={{ ...thStyle, width: '18%' }} onClick={() => toggleSort('name')}>
                  Name <SortIcon field="name" sort={sort} />
                </th>
                <th style={{ ...thStyle, width: '30%' }}>URL</th>
                <th style={{ ...thStyle }} onClick={() => toggleSort('description')}>
                  Description <SortIcon field="description" sort={sort} />
                </th>
              </tr>
            </thead>
            <tbody>
              {sorted.map(fav => {
                const isActive = sidebar?.entry?.id === fav.id;
                return (
                  <tr key={fav.id}
                    onClick={() => setSidebar({ mode: 'edit', entry: fav })}
                    style={{ cursor: 'pointer', background: isActive ? 'rgba(0,0,220,0.07)' : 'white' }}
                    onMouseEnter={e => { if (!isActive) e.currentTarget.style.background = 'rgb(240,240,240)'; }}
                    onMouseLeave={e => { if (!isActive) e.currentTarget.style.background = 'white'; }}>
                    <td style={{ ...tdStyle, color: '#aaa', fontVariantNumeric: 'tabular-nums' }}>{fav.position}</td>
                    <td style={tdStyle}>{fav.name}</td>
                    <td style={{ ...tdStyle, color: 'rgba(0,0,180,1)', fontFamily: 'monospace', fontSize: '0.8rem' }}>{fav.url}</td>
                    <td style={{ ...tdStyle, color: '#666' }}>{fav.description}</td>
                  </tr>
                );
              })}
              {favorites.length === 0 && (
                <tr>
                  <td colSpan={4} style={{ ...tdStyle, color: '#999', textAlign: 'center', padding: '2rem' }}>
                    No favorites yet. Add one to get started.
                  </td>
                </tr>
              )}
            </tbody>
          </table>
        </main>

        {sidebar && (
          <FavoritesSidebar
            mode={sidebar.mode}
            entry={sidebar.entry}
            onSave={handleSave}
            onDelete={handleDelete}
            onClose={() => setSidebar(null)}
          />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
