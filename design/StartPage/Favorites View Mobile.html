<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StartPage — Favorites Mobile — Gutschi.site</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../Icon.jsx"></script>
<script type="text/babel" src="../android-frame.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: sans-serif; background: #e8e8e8; display: flex; align-items: center; justify-content: center; }
  #root { height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;

const INITIAL_FAVORITES = [
  { id: 1, position: 1, name: 'GitHub',    url: 'https://github.com',        description: 'Source code hosting' },
  { id: 2, position: 2, name: 'Outlook',   url: 'https://outlook.com',       description: 'Work email' },
  { id: 3, position: 3, name: 'Scaleway',  url: 'https://scaleway.com',      description: 'Cloud infrastructure' },
  { id: 4, position: 4, name: 'OneDrive',  url: 'https://onedrive.live.com', description: 'File storage' },
  { id: 5, position: 5, name: 'YouTube',   url: 'https://youtube.com',       description: '' },
  { id: 6, position: 6, name: 'Wikipedia', url: 'https://wikipedia.org',     description: 'Reference' },
];

function MobileInput({ label, value, onChange, type = 'text' }) {
  return (
    <div style={{ position: 'relative', flexShrink: 0 }}>
      <input
        type={type} value={value} onChange={onChange}
        placeholder=" "
        style={{
          display: 'block', fontFamily: 'sans-serif',
          padding: '1rem 0.5rem 0.25rem 0.5rem',
          borderRadius: '6px', border: '1px solid rgba(200,200,200,1)',
          width: '100%', height: '2.5rem', fontSize: '1rem', background: 'white',
        }}
        onFocus={e => e.target.style.background = 'rgba(0,0,220,0.04)'}
        onBlur={e => e.target.style.background = 'white'}
      />
      <label style={{
        color: 'rgba(0,0,0,0.6)', position: 'absolute',
        left: '0.5rem', top: '0.1rem', fontSize: '0.65rem', pointerEvents: 'none',
      }}>{label}</label>
    </div>
  );
}

function MobileBtn({ variant = 'primary', onClick, children, style: s }) {
  const cols = {
    primary:   { background: 'rgba(0,0,220,1)',  color: 'white', border: '1px solid rgba(0,0,150,1)' },
    secondary: { background: 'white',            color: 'black', border: '1px solid rgba(200,200,200,1)' },
    danger:    { background: 'rgba(220,0,0,1)',  color: 'white', border: '1px solid rgba(150,0,0,1)' },
  };
  return (
    <button onClick={onClick} style={{
      width: '100%', height: '2.5rem', borderRadius: '6px',
      fontFamily: 'sans-serif', fontSize: '0.9rem', cursor: 'pointer',
      ...cols[variant], ...s,
    }}>{children}</button>
  );
}

function FavoriteOverlay({ mode, entry, onSave, onDelete, onClose }) {
  const [position, setPosition] = useState(entry ? String(entry.position) : '');
  const [name, setName] = useState(entry ? entry.name        : '');
  const [url,  setUrl]  = useState(entry ? entry.url         : '');
  const [desc, setDesc] = useState(entry ? entry.description : '');
  const [confirmDel, setConfirmDel] = useState(false);
  const title = mode === 'new' ? 'New favorite' : 'Edit favorite';

  function handleSave() {
    if (!name.trim() || !url.trim()) return;
    onSave({ position: parseInt(position, 10) || 0, name: name.trim(), url: url.trim(), description: desc.trim() });
  }

  return (
    <div style={{
      position: 'absolute', inset: 0, background: 'white',
      display: 'flex', flexDirection: 'column', zIndex: 50,
      animation: 'slideUp 0.25s ease-out',
    }}>
      {/* Overlay header */}
      <div style={{
        display: 'flex', alignItems: 'center',
        background: 'rgba(0,0,220,1)', color: 'white',
        height: '2.75rem', padding: '0 1rem', flexShrink: 0,
      }}>
        <span style={{ fontSize: '1rem', fontWeight: 600, flexGrow: 1 }}>{title}</span>
        <button onClick={onClose} style={{
          background: 'transparent', border: 'none', color: 'white',
          cursor: 'pointer', display: 'flex', alignItems: 'center',
          padding: '0.5rem', margin: '-0.5rem',
        }}>
          <Icon name="close" style={{ width: '1.75rem', height: '1.75rem' }} />
        </button>
      </div>

      {/* Form — grows to fill space */}
      <div style={{ flexGrow: 1, padding: '1rem', display: 'flex', flexDirection: 'column', gap: '0.5rem', minHeight: 0 }}>
        {mode === 'edit' && entry && (
          <p style={{ fontWeight: 600, flexShrink: 0 }}>{entry.name}</p>
        )}
        <MobileInput label="Position" value={position} onChange={e => setPosition(e.target.value)} type="number" />
        <MobileInput label="Name" value={name} onChange={e => setName(e.target.value)} />
        <MobileInput label="URL"  value={url}  onChange={e => setUrl(e.target.value)} type="url" />

        {/* Description textarea — stretches */}
        <div style={{ flexGrow: 1, display: 'flex', flexDirection: 'column', position: 'relative', minHeight: 0 }}>
          <label style={{
            fontSize: '0.65rem', color: 'rgba(0,0,0,0.6)',
            position: 'absolute', left: '0.5rem', top: '0.25rem', pointerEvents: 'none', zIndex: 1,
          }}>Description</label>
          <textarea
            value={desc}
            onChange={e => setDesc(e.target.value)}
            style={{
              flexGrow: 1, width: '100%', resize: 'none',
              border: '1px solid rgba(200,200,200,1)', borderRadius: '6px',
              padding: '1.25rem 0.5rem 0.5rem',
              fontFamily: 'sans-serif', fontSize: '0.95rem', lineHeight: 1.5,
              outline: 'none', minHeight: 0,
            }}
            onFocus={e => e.target.style.background = 'rgba(0,0,220,0.04)'}
            onBlur={e => e.target.style.background = 'white'}
          />
        </div>
      </div>

      {/* Buttons — pinned to bottom */}
      <div style={{ flexShrink: 0, padding: '0.75rem 1rem', borderTop: '1px solid rgba(200,200,200,1)', display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
        {confirmDel ? (
          <>
            <div style={{
              padding: '0.65rem 0.75rem',
              border: '1px solid rgba(220,0,0,0.3)', borderRadius: '6px',
              background: 'rgba(220,0,0,0.05)',
            }}>
              <p style={{ fontSize: '0.82rem' }}>
                Delete <strong>{entry.name}</strong>? This cannot be undone.
              </p>
            </div>
            <MobileBtn variant="danger"    onClick={() => onDelete(entry.id)}>Confirm delete</MobileBtn>
            <MobileBtn variant="secondary" onClick={() => setConfirmDel(false)}>Cancel</MobileBtn>
          </>
        ) : (
          <>
            <MobileBtn variant="primary" onClick={handleSave}>Save</MobileBtn>
            {mode === 'edit' && (
              <MobileBtn variant="danger" onClick={() => setConfirmDel(true)}>Delete</MobileBtn>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function FavoritesMobile() {
  const [favorites, setFavorites] = useState(INITIAL_FAVORITES);
  const [overlay, setOverlay] = useState(null);
  const nextId = useRef(INITIAL_FAVORITES.length + 1);

  function handleSave(data) {
    if (overlay.mode === 'new') {
      const id = nextId.current++;
      setFavorites(f => [...f, { id, ...data }]);
    } else {
      setFavorites(f => f.map(x => x.id === overlay.entry.id ? { ...x, ...data } : x));
    }
    setOverlay(null);
  }

  function handleDelete(id) {
    setFavorites(f => f.filter(x => x.id !== id));
    setOverlay(null);
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', background: 'white', position: 'relative', overflow: 'hidden' }}>

      {/* Header */}
      <div style={{
        display: 'flex', alignItems: 'center',
        background: 'rgba(0,0,220,1)', color: 'white',
        height: '2.75rem', padding: '0 1rem', flexShrink: 0,
      }}>
        <span style={{ fontSize: '1rem', fontWeight: 600, flexGrow: 1 }}>StartPage</span>
        <a href="../Start Page Mobile.html" title="Dashboard" style={{
          color: 'white', textDecoration: 'none',
          width: '2.75rem', height: '2.75rem', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
        }}
          onMouseEnter={e => e.currentTarget.style.background = 'rgba(0,0,255,1)'}
          onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z"/></svg>
        </a>
        <a href="#" onClick={e => e.preventDefault()} title="Logout" style={{
          color: 'white', textDecoration: 'none',
          width: '2.75rem', height: '2.75rem', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
        }}
          onMouseEnter={e => e.currentTarget.style.background = 'rgba(0,0,255,1)'}
          onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path fillRule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/><path fillRule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/></svg>
        </a>
      </div>

      {/* Sub-nav */}
      <div style={{
        display: 'flex', borderBottom: '1px solid rgba(200,200,200,1)',
        padding: '0 1rem', flexShrink: 0,
      }}>
        <div style={{
          padding: '0.5rem 0', marginRight: '1rem',
          borderBottom: '2px solid rgba(0,0,220,1)',
          fontSize: '0.9rem', fontWeight: 600, color: 'rgba(0,0,220,1)',
        }}>Favorites</div>
      </div>

      {/* List */}
      <div style={{ flexGrow: 1, overflowY: 'auto' }}>

        {favorites.map(fav => (
          <div key={fav.id}
            onClick={() => setOverlay({ mode: 'edit', entry: fav })}
            style={{
              padding: '0.65rem 1rem',
              borderBottom: '1px solid rgba(200,200,200,1)',
              cursor: 'pointer', background: 'white',
            }}
            onMouseEnter={e => e.currentTarget.style.background = 'rgb(240,240,240)'}
            onMouseLeave={e => e.currentTarget.style.background = 'white'}>
            <div style={{ fontWeight: 600, fontSize: '0.9rem' }}>
              <span style={{ color: '#aaa', fontVariantNumeric: 'tabular-nums', marginRight: '0.4rem' }}>{fav.position}.</span>{fav.name}
            </div>
            <div style={{ fontSize: '0.72rem', color: '#888', marginTop: '0.1rem', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{fav.url}</div>
            {fav.description ? (
              <div style={{ fontSize: '0.78rem', color: '#555', marginTop: '0.2rem' }}>{fav.description}</div>
            ) : null}
          </div>
        ))}
        {favorites.length === 0 && (
          <div style={{ textAlign: 'center', color: '#999', padding: '3rem 1rem', fontSize: '0.9rem' }}>
            No favorites yet.
          </div>
        )}
      </div>

      {/* Sticky bottom bar — Add favorite */}
      <div style={{
        flexShrink: 0, padding: '0.75rem 1rem',
        borderTop: '1px solid rgba(200,200,200,1)',
        background: 'white',
      }}>
        <button
          onClick={() => setOverlay({ mode: 'new', entry: null })}
          style={{
            display: 'block', width: '100%', height: '2.75rem',
            background: 'rgba(0,0,220,1)', color: 'white',
            border: '1px solid rgba(0,0,150,1)', borderRadius: '6px',
            fontFamily: 'sans-serif', fontSize: '1rem', cursor: 'pointer',
          }}
          onMouseEnter={e => e.target.style.background = 'rgba(0,0,255,1)'}
          onMouseLeave={e => e.target.style.background = 'rgba(0,0,220,1)'}>
          Add favorite
        </button>
      </div>

      {overlay && (
        <FavoriteOverlay
          mode={overlay.mode}
          entry={overlay.entry}
          onSave={handleSave}
          onDelete={handleDelete}
          onClose={() => setOverlay(null)}
        />
      )}
    </div>
  );
}

function App() {
  return (
    <AndroidDevice>
      <FavoritesMobile />
    </AndroidDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
