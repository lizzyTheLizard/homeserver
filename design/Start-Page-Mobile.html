<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start Page Mobile — Gutschi.site</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Icon.jsx"></script>
<script type="text/babel" src="android-frame.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #e8e8e8; display: flex; align-items: center; justify-content: center; }
  #root { height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const APPS = [
  { key: 'cash',      name: 'Cash',      icon: 'cash',      description: 'Bookkeeping' },
  { key: 'coeditor',  name: 'CoEditor',  icon: 'coeditor',  description: 'Document editor' },
  { key: 'admin',     name: 'Admin',     icon: 'admin',     description: 'Server admin' },
  { key: 'startpage', name: 'StartPage', icon: 'startpage', description: 'Browser start page' },
];

const BOOKMARKS = [
  { label: 'SwissQuote',       url: 'https://swissquote.ch' },
  { label: 'Berner KB',        url: 'https://bekb.ch' },
  { label: 'PostFinance',      url: 'https://postfinance.ch' },
  { label: 'APV Hosting',      url: '#' },
  { label: 'APV Datenbank',    url: '#' },
  { label: 'Gutschi Hoststar', url: 'https://my.hoststar.ch' },
  { label: 'Gutschi Scaleway', url: 'https://console.scaleway.com' },
  { label: 'Outlook',          url: 'https://outlook.com' },
  { label: 'GitHub',           url: 'https://github.com' },
];

const WEATHER = { city: 'Zürich', temp: 17, condition: 'Partly cloudy' };

const MOCK_STATUS = {
  forecast: [
    { time: '12:00', temp: 30, condition: 'Cloudy' },
    { time: '21:00', temp: 15, condition: 'Rain' },
  ],
  tasks: [
    { text: 'Review Q2 budget report', tag: 'Today' },
    { text: 'Call back Dr. Müller', tag: 'Today' },
    { text: 'Update homeserver backup config', tag: 'Yesterday', urgent: true },
  ],
  whatsapp: {
    needReply: [
      { from: 'Thomas', what: 'wants to know if you come to dinner on Saturday', ago: '2h ago' },
      { from: 'Sarah', what: 'wants to send her the document', ago: '4h ago' },
      { from: 'Familie', what: 'wants to know what time works for the call', ago: 'yesterday', urgent: true },
    ],
    unarchived: 3,
    unread: 7,
  },
  emails: {
    needReply: [
      { from: 'Stefan Meier', what: 'want infos about the project meeting next week', ago: '1d ago' },
      { from: 'Oliver Braun', what: 'has a question about Q2 numbers', ago: '2d ago', urgent: true },
      { from: 'MIGROS', what: 'has weekly specials', ago: '3d ago' },
    ],
    unread: 3,
    focus: 5,
    other: 12,
  },
};

const INITIAL_ACTIONS = [
  'Answer Thomas (WhatsApp)',
  'Reply to Oliver Braun',
  'Get news summary',
  'Show full inbox',
];

function getTimeOfDay() {
  const h = new Date().getHours();
  if (h < 12) return 'morning';
  if (h < 18) return 'afternoon';
  return 'evening';
}

function getAIResponse(input) {
  const q = input.toLowerCase();
  if (q.includes('thomas')) {
    return {
      text: 'Thomas asked: "Coming to dinner on Saturday?"\n\nDraft reply:',
      detail: '"Hey Thomas! Yes, I\'ll be there Saturday — what time and where?"',
      actions: ['Send this reply', 'Edit before sending', 'Skip'],
    };
  }
  if (q.includes('sarah')) {
    return {
      text: 'Sarah asked: "Can you send me the document?"\n\nI\'ll need more context. Which document might she mean?',
      actions: ['Ask her which document', 'Remind me tomorrow', 'Skip'],
    };
  }
  if (q.includes('familie')) {
    return {
      text: 'Familie asked: "What time works for the call?"\n\nDraft reply:',
      detail: '"Sunday afternoon works for me — how about 15:00?"',
      actions: ['Send this reply', 'Edit before sending', 'Skip'],
    };
  }
  if (q.includes('oliver') || (q.includes('q2') && q.includes('email'))) {
    return {
      text: 'Oliver Braun wrote: "Quick question — do you have the Q2 summary ready? We need it for Thursday\'s review call."\n\nDraft reply:',
      detail: '"Hi Oliver, I\'ll have the Q2 summary ready by Wednesday EOD and send it over."',
      actions: ['Send this reply', 'Open in Outlook', 'Skip'],
    };
  }
  if (q.includes('stefan')) {
    return {
      text: 'Stefan Meier wrote: "Just confirming the project meeting for next Thursday at 14:00. Let me know if that still works."\n\nDraft reply:',
      detail: '"Hi Stefan, Thursday at 14:00 works great. See you then!"',
      actions: ['Send this reply', 'Suggest different time', 'Skip'],
    };
  }
  if (q.includes('news')) {
    return {
      text: 'Today\'s headlines:\n• ECB holds rates steady — European markets up 0.8%\n• Summer rail schedule changes from June 22 in Switzerland\n• EU AI regulation framework enters final voting phase\n• Zürich: Tram line 10 detour via Helvetiaplatz until August',
      actions: ['More on ECB', 'Local Zürich news', 'Save to reading list'],
    };
  }
  if (q.includes('inbox') || (q.includes('full') && q.includes('email'))) {
    return {
      text: 'Your inbox (5 unread):\n– Nespresso — Order #48291 confirmed\n– Zalando — Return processed, refund in 3–5 days\n– Stefan Meier — Project meeting next week\n– Oliver Braun — Q2 numbers question\n– MIGROS — Weekly specials',
      actions: ['Reply to Stefan Meier', 'Reply to Oliver Braun', 'Open Outlook'],
    };
  }
  if (q.includes('weather') || q.includes('rain') || q.includes('forecast')) {
    return {
      text: 'Forecast for Zürich:\nNow: 17°C, partly cloudy\n17:00 → 16°C, cloudy\n18:00 → 15°C, cloudy\n19:00 → 14°C, rain beginning\n20:00 → 13°C, rain\n21:00 → 13°C, clearing\n\nRain arrives around 19:00 — bring an umbrella if heading out tonight.',
      actions: ['5-day forecast', 'Set rain alert'],
    };
  }
  if (q.includes('task') || q.includes('todo')) {
    return {
      text: 'Your tasks:\n1. Review Q2 budget report ← due today\n2. Call back Dr. Müller\n3. Update homeserver backup config (this week)',
      actions: ['Mark Q2 report done', 'Set reminder for Dr. Müller', 'Add new task'],
    };
  }
  if (q.includes('whatsapp') || (q.includes('message') && !q.includes('email'))) {
    return {
      text: 'WhatsApp messages waiting:\n• Thomas (2h): "Coming to dinner on Saturday?"\n• Sarah (4h): "Can you send me the document?"\n• Familie (yesterday): "What time for the call?"',
      actions: ['Answer Thomas', 'Answer Sarah', 'Answer Familie'],
    };
  }
  if (q === 'send this reply' || q === 'skip' || q.includes('done') || q.includes('sent')) {
    return {
      text: 'Done. Anything else I can help with?',
      actions: ['Show tasks', 'Check WhatsApp', 'Get news summary'],
    };
  }
  if (q.includes('hello') || q.includes('hi') || q.includes('hallo') || q.includes('hey')) {
    return {
      text: 'Hello! Ask me about your emails, messages, tasks, weather, or news — or tap a suggestion.',
      actions: ['Show tasks', 'Check emails', 'Get news summary', 'Weather forecast'],
    };
  }
  return {
    text: 'I can help with that. What would you like to check?',
    actions: ['Tasks', 'Emails', 'WhatsApp messages', 'News & weather'],
  };
}

// ── Status overview ────────────────────────────────────────────────
function StatusOverview() {
  const urgent = { color: 'rgba(185,30,30,0.9)', fontWeight: 600 };
  return (
    <div style={{ fontSize: '0.85rem', lineHeight: 1.65, color: '#1a1a2e' }}>
      <div style={{ marginBottom: '0.7rem', color: '#333' }}>
        Good {getTimeOfDay()}! Here's your overview.
      </div>
      <div style={{ marginBottom: '0.6rem' }}>
        {WEATHER.city} is <strong>{WEATHER.temp}°C, {WEATHER.condition}</strong>. Expect{' '}
        {MOCK_STATUS.forecast.map((f, i) => (
          <span key={i}><strong>{f.temp}°C and {f.condition.toLowerCase()}</strong> at {f.time}{i < MOCK_STATUS.forecast.length - 1 ? ', ' : ''}</span>
        ))}.
      </div>
      <div style={{ marginBottom: '0.6rem' }}>
        <strong>{MOCK_STATUS.tasks.length} tasks</strong>: {MOCK_STATUS.tasks.map((t, i) => (
          <span key={i}>
            {t.text}<span style={t.urgent ? urgent : { color: '#666' }}> ({t.tag})</span>{i < MOCK_STATUS.tasks.length - 1 ? ', ' : ''}
          </span>
        ))}.
      </div>
      <div style={{ marginBottom: '0.6rem' }}>
        WhatsApp — {MOCK_STATUS.whatsapp.needReply.map((t, i) => (
          <span key={i}>
            <strong>{t.from}</strong> {t.what}<span style={t.urgent ? urgent : { color: '#666' }}> ({t.ago})</span>{i < MOCK_STATUS.whatsapp.needReply.length - 1 ? ', ' : ''}
          </span>
        ))}.
      </div>
      <div>
        Email — {MOCK_STATUS.emails.needReply.map((t, i) => (
          <span key={i}>
            <strong>{t.from}</strong> {t.what}<span style={t.urgent ? urgent : { color: '#666' }}> ({t.ago})</span>{i < MOCK_STATUS.emails.needReply.length - 1 ? ', ' : ''}
          </span>
        ))}.
      </div>
    </div>
  );
}

// ── Chat message components ────────────────────────────────────────
function UserMessage({ msg }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
      <div style={{
        background: 'rgba(0,0,210,1)', color: 'white',
        padding: '0.5rem 0.9rem', borderRadius: '16px 16px 3px 16px',
        maxWidth: '82%', fontSize: '0.85rem', lineHeight: 1.5,
      }}>
        {msg.text}
      </div>
    </div>
  );
}

function AiMessage({ msg }) {
  return (
    <div>
      <div style={{
        background: 'rgb(236,237,245)',
        borderRadius: '16px 16px 16px 3px',
        padding: '0.75rem 0.9rem',
        fontSize: '0.85rem', lineHeight: 1.65, color: '#1a1a2e',
      }}>
        {msg.type === 'status'
          ? <StatusOverview />
          : (
            <div>
              <span style={{ whiteSpace: 'pre-line' }}>{msg.text}</span>
              {msg.detail && (
                <div style={{
                  marginTop: '0.5rem', padding: '0.45rem 0.7rem',
                  background: 'rgba(0,0,180,0.07)',
                  borderRadius: '7px', fontStyle: 'italic', color: '#333',
                }}>{msg.detail}</div>
              )}
            </div>
          )
        }
      </div>
    </div>
  );
}

function TypingIndicator() {
  return (
    <div style={{ display: 'inline-flex' }}>
      <div style={{
        background: 'rgb(236,237,245)',
        borderRadius: '16px 16px 16px 3px',
        padding: '0.65rem 0.85rem',
        display: 'flex', gap: '4px', alignItems: 'center',
      }}>
        {[0, 0.18, 0.36].map((delay, i) => (
          <div key={i} style={{
            width: '5px', height: '5px', borderRadius: '50%',
            background: 'rgba(0,0,180,0.4)',
            animation: `bounce 1.1s ${delay}s infinite`,
          }} />
        ))}
      </div>
    </div>
  );
}

// ── AI Chat window — mobile layout ────────────────────────────────
function AIChatWindow({ onUserChat }) {
  const [messages, setMessages] = useState([
    { id: 0, role: 'ai', type: 'status', actions: INITIAL_ACTIONS },
  ]);
  const [input, setInput] = useState('');
  const [isTyping, setIsTyping] = useState(false);
  const listRef = useRef(null);

  useEffect(() => {
    if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
  }, [messages, isTyping]);

  function send(text) {
    const t = text.trim();
    if (!t) return;
    if (onUserChat) onUserChat();
    setMessages(prev => [...prev, { id: Date.now(), role: 'user', text: t }]);
    setInput('');
    setIsTyping(true);
    setTimeout(() => {
      const r = getAIResponse(t);
      setMessages(prev => [...prev, { id: Date.now() + 1, role: 'ai', ...r }]);
      setIsTyping(false);
    }, 650 + Math.random() * 450);
  }

  function handleSubmit(e) {
    e.preventDefault();
    send(input);
  }

  const canSend = input.trim().length > 0;
  const latestActions = messages.length > 0 ? messages[messages.length - 1].actions : null;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', flexGrow: 1, minHeight: 0, overflow: 'hidden', marginBottom: '0.25rem' }}>

      {/* Messages — normal order, auto-scroll to bottom */}
      <div ref={listRef} style={{
        flex: 1, minHeight: 0, overflowY: 'auto',
        display: 'flex', flexDirection: 'column', gap: '0.6rem',
        paddingTop: '0.1rem', paddingBottom: '0.25rem',
      }}>
        {messages.map(msg =>
          msg.role === 'ai'
            ? <AiMessage key={msg.id} msg={msg} />
            : <UserMessage key={msg.id} msg={msg} />
        )}
        {isTyping && <TypingIndicator />}
      </div>

      {/* Suggestion chips — wrapped */}
      {latestActions && (
        <div style={{
          display: 'flex', flexWrap: 'wrap', gap: '0.25rem',
          padding: '0.25rem 0.05rem 0.1rem',
        }}>
          {latestActions.map(a => (
            <button key={a} onClick={() => send(a)} style={{
              padding: '0.28rem 0.75rem',
              background: 'rgba(0,0,210,0.07)',
              border: '1px solid rgba(0,0,210,0.22)',
              borderRadius: '18px', cursor: 'pointer',
              fontSize: '0.75rem', color: 'rgba(0,0,180,1)',
              fontFamily: 'inherit', fontWeight: 500,
              flexShrink: 0,
              transition: 'background 0.12s',
            }}
              onMouseEnter={e => { e.currentTarget.style.background = 'rgba(0,0,210,0.13)'; }}
              onMouseLeave={e => { e.currentTarget.style.background = 'rgba(0,0,210,0.07)'; }}
            >{a}</button>
          ))}
        </div>
      )}

      {/* Input — pill (always at bottom, does not scroll) */}
      <form onSubmit={handleSubmit} style={{
        display: 'flex', alignItems: 'center', flexShrink: 0,
        background: 'white',
        border: '1.5px solid rgba(0,0,0,0.13)',
        borderRadius: '24px',
        padding: '0.25rem 0.25rem 0.25rem 1rem',
        boxShadow: '0 2px 10px rgba(0,0,0,0.07)',
        gap: '0.4rem',
      }}>
        <input
          value={input}
          onChange={e => setInput(e.target.value)}
          placeholder="Ask me anything…"
          style={{
            flexGrow: 1, height: '1.9rem', fontSize: '0.9rem',
            border: 'none', padding: '0', fontFamily: 'inherit', outline: 'none',
            background: 'transparent', color: '#1a1a2e',
          }}
        />
        <button type="submit" style={{
          width: '2rem', height: '2rem', borderRadius: '50%', flexShrink: 0,
          background: canSend ? 'rgba(0,0,210,1)' : 'rgba(215,215,225,1)',
          border: 'none', cursor: canSend ? 'pointer' : 'default',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          transition: 'background 0.15s',
        }}>
          <svg width="11" height="11" viewBox="0 0 13 13" fill="none">
            <path d="M6.5 11V2M2 6.5l4.5-4.5 4.5 4.5" stroke={canSend ? 'white' : '#aaa'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </button>
      </form>
    </div>
  );
}

// ── Weather icon ───────────────────────────────────────────────────
function WeatherIcon({ size = 20 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 32 32" fill="none">
      <circle cx="12" cy="12" r="5" fill="rgba(0,0,220,0.7)" />
      <line x1="12" y1="4" x2="12" y2="2" stroke="rgba(0,0,220,0.7)" strokeWidth="1.5" strokeLinecap="round"/>
      <line x1="12" y1="22" x2="12" y2="20" stroke="rgba(0,0,220,0.7)" strokeWidth="1.5" strokeLinecap="round"/>
      <line x1="4" y1="12" x2="2" y2="12" stroke="rgba(0,0,220,0.7)" strokeWidth="1.5" strokeLinecap="round"/>
      <line x1="22" y1="12" x2="20" y2="12" stroke="rgba(0,0,220,0.7)" strokeWidth="1.5" strokeLinecap="round"/>
      <line x1="6.34" y1="6.34" x2="4.93" y2="4.93" stroke="rgba(0,0,220,0.7)" strokeWidth="1.5" strokeLinecap="round"/>
      <line x1="19.07" y1="19.07" x2="17.66" y2="17.66" stroke="rgba(0,0,220,0.7)" strokeWidth="1.5" strokeLinecap="round"/>
      <rect x="8" y="18" width="18" height="9" rx="4.5" fill="rgba(200,200,200,1)" />
      <rect x="13" y="15" width="10" height="8" rx="4" fill="rgba(200,200,200,1)" />
    </svg>
  );
}

// ── Page ───────────────────────────────────────────────────────────
function StartPageMobile() {
  const [showAppsBm, setShowAppsBm] = useState(true);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', background: 'white', overflow: 'hidden' }}>

      {/* Slim blue bar */}
      <div style={{
        display: 'flex', alignItems: 'center',
        background: 'rgba(0,0,220,1)', color: 'white',
        height: '2.75rem', padding: '0 1rem', flexShrink: 0,
      }}>
        <span style={{ fontSize: '1rem', fontWeight: 600 }}>Homeserver</span>
        <div style={{ flexGrow: 1 }} />
        <a href="#" onClick={e => e.preventDefault()} title="Logout" style={{
          color: 'white', textDecoration: 'none',
          width: '2.75rem', height: '2.75rem', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
        }}
          onMouseEnter={e => e.currentTarget.style.background = 'rgba(0,0,255,1)'}
          onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path fillRule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/><path fillRule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/></svg>
        </a>
      </div>

      {/* Content */}
      <div style={{ flexGrow: 1, display: 'flex', flexDirection: 'column', padding: '0.4rem 0.6rem 0.2rem', minHeight: 0, overflow: 'hidden' }}>

        {/* AI Chat */}
        <AIChatWindow onUserChat={() => setShowAppsBm(false)} />

        {/* Collapsible Apps & Bookmarks */}
        <div style={{ flexShrink: 0 }}>
          <div
            onClick={() => setShowAppsBm(!showAppsBm)}
            style={{
              display: 'flex', alignItems: 'center', gap: '0.3rem',
              padding: '0.3rem 0.2rem', cursor: showAppsBm ? 'auto' : 'pointer',
              fontSize: '0.75rem', color: '#666', userSelect: 'none',
            }}
          >
            {!showAppsBm && <>
              <svg width="10" height="10" viewBox="0 0 10 10">
                <path d="M3 1l4 4-4 4" stroke="currentColor" strokeWidth="1.5" fill="none" strokeLinecap="round"/>
              </svg>
              Apps & Bookmarks
            </>}
          </div>
          {showAppsBm && (
            <>
              <div style={{ display: 'flex', gap: '0.25rem', marginBottom: '0.35rem' }}>
                {APPS.map(app => (
                  <a key={app.key} href="#" onClick={e => e.preventDefault()} style={{
                    flex: '1', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
                    padding: '0.35rem 0.15rem',
                    border: '1px solid rgba(200,200,200,1)', borderRadius: '7px',
                    textDecoration: 'none', color: 'black', background: 'white',
                  }}>
                    <Icon name={app.icon} style={{ width: '1.5rem', height: '1.5rem', marginBottom: '0.15rem' }} />
                    <div style={{ fontWeight: 600, fontSize: '0.6rem', textAlign: 'center' }}>{app.name}</div>
                  </a>
                ))}
              </div>
              <div style={{ display: 'flex', gap: '0.25rem', flexWrap: 'wrap', paddingBottom: '0.25rem' }}>
                {BOOKMARKS.map(b => (
                  <a key={b.label} href={b.url} target="_blank" rel="noopener" style={{
                    flex: '1 1 calc(25% - 0.4rem)', minWidth: 0,
                    display: 'block', padding: '0.35rem 0.25rem', textAlign: 'center',
                    border: '1px solid rgba(200,200,200,1)', borderRadius: '5px',
                    textDecoration: 'none', color: '#333', fontSize: '0.7rem',
                    background: 'white', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                  }}>
                    {b.label}
                  </a>
                ))}
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <AndroidDevice>
      <StartPageMobile />
    </AndroidDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
