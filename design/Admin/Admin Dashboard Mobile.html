<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard Mobile — Gutschi.site</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../Icon.jsx"></script>
<script type="text/babel" src="../android-frame.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: sans-serif; background: #e8e8e8; display: flex; align-items: center; justify-content: center; }
  #root { height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

function fmtTwoLine(isoString) {
  const d = new Date(isoString);
  const datePart = d.toLocaleDateString('de-CH', { weekday: 'long', day: '2-digit', month: '2-digit', year: '2-digit' });
  const timePart = d.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  return { datePart, timePart };
}

const BUILD_STARTED = fmtTwoLine('2026-04-23T04:44:08Z');
const RUN_STARTED   = fmtTwoLine('2026-04-23T07:33:51.828Z');

const BUILD = {
  branch:      'main',
  commitShort: '648125f',
  commitUrl:   'https://github.com',
  action:      '24817205370',
  origin:      'GitHub',
};
const RUN = {
  instanceFull: '0194f1d0-bccd-4782-b7f0-b13a82a1cfdf',
  uptime:       79,
  environment:  'production',
};
const CONFIG = {
  databaseEnv: 'prod',
  databaseUrl: 'https://db.gutschi.site',
  appUrl:      'www.gutschi.site',
  appUrlHref:  'https://www.gutschi.site',
  clientEnv:   'Homeserver',
  clientUrl:   'https://auth.gutschi.site',
};
const METRICS = [
  { label: 'Memory',                      value: '35.37 MB' },
  { label: 'CoEditor cmds (day)',          value: '0' },
  { label: 'CoEditor cmds (30 days)',      value: '0' },
  { label: 'Cash transactions (day)',      value: '0' },
  { label: 'Cash transactions (30 days)', value: '24' },
];
const LOGS = [
  { time: '07:33:51', level: 'INFO', msg: 'Server started on port 3000' },
  { time: '07:33:52', level: 'INFO', msg: 'Connected to database' },
  { time: '07:41:03', level: 'WARN', msg: 'Disk usage above 75% on /var' },
  { time: '07:55:28', level: 'INFO', msg: 'Cash report generated' },
];

function SectionLabel({ children }) {
  return (
    <div style={{ fontSize: '0.65rem', fontWeight: 700, color: '#888', textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: '0.75rem' }}>
      {children}
    </div>
  );
}

function KV({ label, value, mono, link, accent, href }) {
  const valStyle = {
    fontSize: '0.75rem',
    fontFamily: mono ? 'monospace' : 'sans-serif',
    color: link ? 'rgba(0,0,220,1)' : accent || 'black',
    textDecoration: link ? 'underline' : 'none',
    wordBreak: 'break-word', textAlign: 'right',
  };
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: '0.5rem', padding: '0.35rem 0', borderBottom: '1px solid rgba(200,200,200,0.5)' }}>
      <span style={{ fontSize: '0.75rem', color: '#666', whiteSpace: 'nowrap', flexShrink: 0 }}>{label}</span>
      {link && href
        ? <a href={href} target="_blank" rel="noopener" style={valStyle}>{value}</a>
        : <span style={valStyle}>{value}</span>}
    </div>
  );
}

function Card({ children, style }) {
  return (
    <div style={{ border: '1px solid rgba(200,200,200,1)', borderRadius: '6px', padding: '1rem', background: 'white', display: 'flex', flexDirection: 'column', ...style }}>
      {children}
    </div>
  );
}

function LevelBadge({ level }) {
  const colors = {
    INFO:  { bg: 'rgba(0,0,220,0.08)',  color: 'rgba(0,0,150,1)' },
    WARN:  { bg: 'rgba(220,120,0,0.1)', color: 'rgba(160,80,0,1)' },
    ERROR: { bg: 'rgba(220,0,0,0.1)',   color: 'rgba(150,0,0,1)' },
  };
  const c = colors[level] || colors.INFO;
  return (
    <span style={{ fontSize: '0.65rem', fontWeight: 700, padding: '1px 5px', borderRadius: '3px', background: c.bg, color: c.color }}>
      {level}
    </span>
  );
}

function AdminDashboardMobile() {
  const [tab, setTab] = useState('dashboard');

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', background: 'white' }}>
      {/* Header */}
      <div style={{
        display: 'flex', alignItems: 'center',
        background: 'rgba(0,0,220,1)', color: 'white',
        height: '2.75rem', padding: '0 1rem', flexShrink: 0,
      }}>
        <span style={{ fontSize: '1rem', fontWeight: 600 }}>Admin</span>
        <div style={{ flexGrow: 1 }} />
        <a href="../Start Page Mobile.html" title="Dashboard" style={{
          color: 'white', textDecoration: 'none',
          width: '2.75rem', height: '2.75rem', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
        }}
          onMouseEnter={e => e.currentTarget.style.background = 'rgba(0,0,255,1)'}
          onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z"/></svg>
        </a>
        <a href="#" onClick={e => e.preventDefault()} title="Logout" style={{
          color: 'white', textDecoration: 'none',
          width: '2.75rem', height: '2.75rem', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
        }}
          onMouseEnter={e => e.currentTarget.style.background = 'rgba(0,0,255,1)'}
          onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path fillRule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/><path fillRule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/></svg>
        </a>
      </div>

      {/* Tab bar */}
      <div style={{ display: 'flex', borderBottom: '1px solid rgba(200,200,200,1)', background: 'white', flexShrink: 0 }}>
        {['Dashboard', 'Metrics', 'Config', 'Cash'].map(t => (
          <button key={t} onClick={() => setTab(t.toLowerCase())} style={{
            flex: 1, height: '2.5rem', fontSize: '0.75rem', fontFamily: 'sans-serif',
            border: 'none', background: 'transparent', cursor: 'pointer',
            borderBottom: tab === t.toLowerCase() ? '2px solid rgba(0,0,220,1)' : '2px solid transparent',
            color: tab === t.toLowerCase() ? 'rgba(0,0,220,1)' : '#555',
            fontWeight: tab === t.toLowerCase() ? 600 : 400,
          }}>{t}</button>
        ))}
      </div>

      {/* Scrollable content */}
      <div style={{ flexGrow: 1, overflowY: 'auto', padding: '1rem', display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>

        <Card>
          <SectionLabel>Build</SectionLabel>
          <KV label="Branch" value={BUILD.branch} link />
          <KV label="Commit" value={BUILD.commitShort} link href={BUILD.commitUrl} mono />
          <KV label="Action" value={BUILD.action} link />
          <KV label="Origin" value={BUILD.origin} />
          <KV label="Built"  value={`${BUILD_STARTED.datePart} ${BUILD_STARTED.timePart}`} />
        </Card>

        <Card>
          <SectionLabel>Run</SectionLabel>
          <KV label="Instance"    value={RUN.instanceFull} />
          <KV label="Started"     value={`${RUN_STARTED.datePart} ${RUN_STARTED.timePart}`} />
          <KV label="Uptime (s)"  value={RUN.uptime} />
          <KV label="Environment" value={RUN.environment} accent="rgba(30,150,30,1)" />
        </Card>

        <Card>
          <SectionLabel>Config</SectionLabel>
          <KV label="Database"  value={CONFIG.databaseEnv} link href={CONFIG.databaseUrl} />
          <KV label="App URL"   value={CONFIG.appUrl}      link href={CONFIG.appUrlHref} />
          <KV label="Client ID" value={CONFIG.clientEnv}   link href={CONFIG.clientUrl} />
          <div style={{ marginTop: 'auto', paddingTop: '0.75rem', textAlign: 'center' }}>
            <a href="#" onClick={e => e.preventDefault()} style={{ fontSize: '0.8rem', color: 'rgba(0,0,220,1)', textDecoration: 'underline' }}>View all →</a>
          </div>
        </Card>

        <Card>
          <SectionLabel>Metrics</SectionLabel>
          {METRICS.map(m => <KV key={m.label} label={m.label} value={m.value} />)}
          <div style={{ marginTop: 'auto', paddingTop: '0.75rem', textAlign: 'center' }}>
            <a href="#" onClick={e => e.preventDefault()} style={{ fontSize: '0.8rem', color: 'rgba(0,0,220,1)', textDecoration: 'underline' }}>View all →</a>
          </div>
        </Card>

        <Card>
          <div style={{ display: 'flex', alignItems: 'center', marginBottom: '0.75rem' }}>
            <SectionLabel>Events</SectionLabel>
            <div style={{ flexGrow: 1 }} />
            <a href="#" onClick={e => e.preventDefault()} style={{ fontSize: '0.8rem', color: 'rgba(0,0,220,1)', textDecoration: 'underline' }}>View logs →</a>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '0.4rem' }}>
            {LOGS.map((l, i) => (
              <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: '0.5rem', padding: '0.35rem 0', borderBottom: '1px solid rgba(200,200,200,0.5)', fontSize: '0.75rem' }}>
                <span style={{ fontFamily: 'monospace', color: '#888', whiteSpace: 'nowrap', flexShrink: 0 }}>{l.time}</span>
                <LevelBadge level={l.level} />
                <span style={{ fontFamily: 'monospace', color: '#333', wordBreak: 'break-word' }}>{l.msg}</span>
              </div>
            ))}
          </div>
        </Card>
      </div>
    </div>
  );
}

function App() {
  return (
    <AndroidDevice>
      <AdminDashboardMobile />
    </AndroidDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
