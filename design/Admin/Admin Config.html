<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Config</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: sans-serif; background: white; }
  #root { height: 100%; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

// ── Config data grouped by section ───────────────────────────
const SECTIONS = [
  {
    id: 'app', label: 'Application',
    entries: [
      { key: 'APP_URL',       value: 'https://www.gutschi.site' },
      { key: 'PORT',          value: '3000' },
      { key: 'NODE_ENV',      value: 'production' },
      { key: 'ADMIN_EMAIL',   value: 'matthias@gutschi.site' },
      { key: 'COOKIE_NAME',   value: 'homeserver_session' },
      { key: 'TURBOPACK',     value: '1' },
    ],
  },
  {
    id: 'build', label: 'Build',
    entries: [
      { key: 'GIT_BRANCH',      value: 'main' },
      { key: 'GIT_COMMIT_HASH', value: '648125fbebd1b57431816525 1c12b3a5d877eb38' },
      { key: 'GITHUB_RUN_ID',   value: '24817205370' },
    ],
  },
  {
    id: 'runtime', label: 'Runtime',
    entries: [
      { key: 'NODE_VERSION',  value: '20.2' },
      { key: 'YARN_VERSION',  value: '1.22.22' },
      { key: 'HOSTNAME',      value: 'homenode' },
      { key: 'RAM',           value: '128' },
      { key: 'TZ',            value: 'Europe/Zurich' },
      { key: 'PATH',          value: '/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin', truncate: true },
    ],
  },
  {
    id: 'auth', label: 'Auth / OIDC',
    entries: [
      { key: 'CLNT_ID',          value: 'f79682fe-0761-4361-aa2e-317957284c3a' },
      { key: 'CLNT_SLCL',        value: 'Homeserver' },
      { key: 'OID_EP',           value: 'https://login.microsoftonline.com/tenant/v2.0/.well-known/openid-configuration', truncate: true },
      { key: 'SESSION_PASSWORD',  value: 'baee820bmebd9tae0fa3tbadfhg1meg3TF5DFG', secret: true },
      { key: 'OPLN_API_KEY',      value: 'a6ba2d2-4c4c-4927-bad2-b801adf65fd7', secret: true },
    ],
  },
  {
    id: 'db', label: 'Database',
    entries: [
      { key: 'DB_CONNECTION_STRING', value: 'postgres://user:password@100.120.0.1:5432/homeserver', secret: true },
    ],
  },
  {
    id: 'infra', label: 'Infrastructure',
    entries: [
      { key: 'SCW_APPLICATION_ID',     value: 'dc4a9fe98-1241-442d-d2d0-aba84a598f1e' },
      { key: 'SCW_APPLICATION_CPU',    value: '70' },
      { key: 'SCW_APPLICATION_MEMORY', value: '256' },
      { key: 'SCW_APPLICATION_NAME',   value: 'www.gutschi.site' },
      { key: 'SCW_NAMESPACE_ID',       value: 'f3dafd4a-171-47ae-b7ab-59cae9abd627' },
      { key: 'KURENBTFLS_PORT',        value: 'tcp/100.120.0.1:443' },
      { key: 'KURENBTFLS_PORT_443_TCP',value: 'tcp://100.120.0.1:443' },
      { key: 'KURENBTFLS_SLRVCI_HOST', value: '100.120.0.1' },
      { key: 'KURENBTFLS_SLRVCI_PORT', value: '443' },
    ],
  },
];

// ── Components ────────────────────────────────────────────────
function SectionLabel({ children }) {
  return (
    <div style={{ fontSize: '0.7rem', fontWeight: 700, color: '#888', textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: '1rem' }}>
      {children}
    </div>
  );
}

function ConfigRow({ entry, showSecrets }) {
  const [expanded, setExpanded] = useState(false);
  const isSecret  = entry.secret;
  const isTrunc   = entry.truncate;
  const val       = entry.value;
  const masked    = '••••••••••••••••';
  const display   = isSecret && !showSecrets ? masked : (isTrunc && !expanded ? val.slice(0, 60) + '…' : val);
  const canToggle = (isSecret && showSecrets) || isTrunc;

  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: '1rem', padding: '0.45rem 0', borderBottom: '1px solid rgba(200,200,200,0.6)' }}>
      <span style={{ fontSize: '0.75rem', color: '#555', fontFamily: 'monospace', whiteSpace: 'nowrap', flexShrink: 0 }}>{entry.key}</span>
      <span style={{ display: 'flex', alignItems: 'baseline', gap: '0.5rem', textAlign: 'right', minWidth: 0 }}>
        <span style={{ fontSize: '0.8rem', fontFamily: 'monospace', wordBreak: 'break-all', color: isSecret && !showSecrets ? '#aaa' : 'black' }}>{display}</span>
        {canToggle && (
          <button onClick={() => setExpanded(v => !v)} style={{
            fontSize: '0.7rem', color: 'rgba(0,0,220,1)', background: 'none', border: 'none',
            cursor: 'pointer', padding: 0, whiteSpace: 'nowrap', flexShrink: 0,
          }}>{expanded ? 'less' : 'more'}</button>
        )}
      </span>
    </div>
  );
}

function ConfigCard({ section, showSecrets, query }) {
  const filtered = section.entries.filter(e => !query || e.key.toLowerCase().includes(query.toLowerCase()) || e.value.toLowerCase().includes(query.toLowerCase()));
  if (filtered.length === 0) return null;
  return (
    <div style={{ border: '1px solid rgba(200,200,200,1)', borderRadius: '6px', padding: '1.25rem', background: 'white' }}>
      <SectionLabel>{section.label}</SectionLabel>
      {filtered.map(e => <ConfigRow key={e.key} entry={e} showSecrets={showSecrets} />)}
    </div>
  );
}

function NavLink({ children, active, onClick }) {
  return (
    <a href="#" onClick={e => { e.preventDefault(); onClick && onClick(); }} style={{
      color: 'white', textDecoration: 'none', fontSize: '0.9rem',
      padding: '0 1rem', height: '4rem', display: 'flex', alignItems: 'center',
      borderBottom: active ? '0.2rem solid white' : 'none',
      paddingTop: active ? '0.2rem' : '0',
    }}
      onMouseEnter={e => e.currentTarget.style.background = 'rgba(0,0,255,1)'}
      onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
      {children}
    </a>
  );
}

function App() {
  const [tab, setTab]             = useState('config');
  const [query, setQuery]         = useState('');
  const [showSecrets, setSecrets] = useState(false);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
      {/* Header */}
      <div style={{
        display: 'flex', alignItems: 'center',
        background: 'rgba(0,0,220,1)', color: 'white',
        height: '4rem', padding: '0 1.5rem', flexShrink: 0,
      }}>
        <span style={{ fontSize: '1.5rem', fontWeight: 600, marginRight: '0.5rem' }}>Admin</span>
        <nav style={{ display: 'flex' }}>
          {['Dashboard', 'Metrics', 'Config', 'Cash'].map(t => (
            <NavLink key={t} active={tab === t.toLowerCase()} onClick={() => setTab(t.toLowerCase())}>{t}</NavLink>
          ))}
        </nav>
        <div style={{ flexGrow: 1 }} />
        {['All Applications', 'Logout'].map(t => <NavLink key={t}>{t}</NavLink>)}
      </div>

      {/* Content */}
      <main style={{ flexGrow: 1, padding: '2rem 1.5rem' }}>
        {/* Toolbar */}
        <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '1.5rem' }}>
          <h1 style={{ fontSize: '1.5rem', fontWeight: 600 }}>Config</h1>
          <div style={{ flexGrow: 1 }} />
          <input
            value={query} onChange={e => setQuery(e.target.value)}
            placeholder="Filter keys…"
            style={{
              height: '2.5rem', fontSize: '0.9rem', width: '220px',
              border: '1px solid rgba(200,200,200,1)', borderRadius: '6px',
              padding: '0 0.75rem', fontFamily: 'sans-serif', outline: 'none',
            }}
            onFocus={e => e.target.style.borderColor = 'rgba(0,0,220,1)'}
            onBlur={e => e.target.style.borderColor = 'rgba(200,200,200,1)'}
          />
          <button onClick={() => setSecrets(v => !v)} style={{
            height: '2.5rem', padding: '0 1rem', borderRadius: '6px', cursor: 'pointer',
            fontFamily: 'sans-serif', fontSize: '0.85rem',
            background: showSecrets ? 'rgba(220,0,0,0.08)' : 'white',
            border: `1px solid ${showSecrets ? 'rgba(220,0,0,0.4)' : 'rgba(200,200,200,1)'}`,
            color: showSecrets ? 'rgba(150,0,0,1)' : '#444',
          }}>
            {showSecrets ? 'Hide secrets' : 'Show secrets'}
          </button>
        </div>

        {/* 2-column grid */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
          {SECTIONS.map(s => <ConfigCard key={s.id} section={s} showSecrets={showSecrets} query={query} />)}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
