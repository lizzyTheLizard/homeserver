<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gutschi.site - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #000;
      background: #fff;
    }
    .container {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      gap: 1rem;
      padding: 2rem;
    }
    .container.active { display: flex; }
    .title { font-size: 2rem; font-weight: 600; }
    .message { font-size: 1.125rem; color: #666; max-width: 30rem; }

    .spinner {
      width: 80px; height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .spinner div {
      position: relative;
      border: 4px solid currentColor;
      border-radius: 50%;
      animation: spin 1.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    @keyframes spin {
      0%, 9% { opacity: 0; top: 36px; left: 36px; width: 8px; height: 8px; }
      10% { top: 36px; left: 36px; width: 8px; height: 8px; opacity: 1; }
      100% { top: 0; left: 0; width: 80px; height: 80px; opacity: 0; }
    }
  </style>
</head>
<body>
  <main class="container active" id="starting">
    <div class="spinner"><div></div></div>
    <p class="message">The server is currently starting. Please wait a moment.</p>
  </main>

  <main class="container" id="offline">
    <h1 class="title">You are offline</h1>
    <p class="message">Please check your internet connection and try again.</p>
  </main>

  <main class="container" id="broken">
    <h1 class="title">Server Error</h1>
    <p class="message">The server is currently unavailable. Please try again later.</p>
  </main>

  <main class="container" id="reload">
    <div class="spinner"><div></div></div>
    <p class="message">Connected. Redirecting...</p>
  </main>

  <script>
    var PING_TIMEOUT_MS = 3000;
    var POLL_INTERVAL_MS = 1000;

    var containers = {
      starting: document.getElementById('starting'),
      offline: document.getElementById('offline'),
      broken: document.getElementById('broken'),
      reload: document.getElementById('reload')
    };

    function show(state) {
      Object.keys(containers).forEach(function (k) { containers[k].classList.remove('active'); });
      containers[state].classList.add('active');
    }

    function scheduleNext() {
      setTimeout(ping, POLL_INTERVAL_MS);
    }

    function ping() {
      if (!navigator.onLine) {
        show('offline');
        scheduleNext();
        return;
      }
      var controller = new AbortController();
      var timeout = setTimeout(function () { controller.abort(); }, PING_TIMEOUT_MS);
      fetch('/ping', { signal: controller.signal })
        .then(function (response) {
          clearTimeout(timeout);
          if (response.ok) {
            show('reload');
            window.location.reload();
          }
          else {
            show('broken');
            scheduleNext();
          }
        })
        .catch(function (error) {
          clearTimeout(timeout);
          if (error instanceof DOMException && error.name === 'AbortError') {
            show('starting');
          }
          else {
            show('broken');
          }
          scheduleNext();
        });
    }

    show('starting');
    ping();
  </script>
</body>
</html>
