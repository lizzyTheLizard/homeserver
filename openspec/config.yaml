schema: spec-driven
context: |
  Every change starts from a GitHub issue.
  The change name, the branch name and the issue are one triple:
  change set `issue-<number>-<slug>` lives on branch `issue-<number>-<slug>`
  and closes issue #<number>. Never work on a change whose name does not
  match the current branch.
  
rules:
  proposal:
    - Derive scope from the linked GitHub issue; do not widen it silently.
      If the issue is too thin to propose from, say so instead of inventing scope.
    - State the issue number in the proposal and keep the proposal's framing
      consistent with the issue title.

  tasks:
    - Every task must be independently implementable, reviewable and committable.
      One task becomes exactly one commit, so a task that cannot stand alone as a
      commit is the wrong size.
    - Order tasks so the branch is never left in a broken state between commits.

operations:
  apply:
    guidance:
      - Work one task at a time. After finishing a task and ticking its checkbox,
        stop and show the user the diff for review. Do not begin the next task
        before they have responded.
      - Once the user approves a task's diff, commit and push it. 
        The commit message must follow the standard format: `<short imperative message> (#<NUMBER>)` 
        and include the `OpenSpec-Change: <change>` and `Agent: <agent>` trailer.
      - After the last task, do not archive yourself. Ask the user to run the gh-change-ship skill instead
