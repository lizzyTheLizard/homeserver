schema: spec-driven
context: |
  Changes are change-first, not issue-first: there is no GitHub issue to file,
  link or close, and no step reads or writes one.

  The change name, the branch name and the change folder are the same value:
  a kebab-case slug `<change>` used verbatim as `openspec/changes/<change>`
  and as branch `<change>`. Never work on a change while a different branch
  is checked out.

  Before the first artifact exists: the working tree is clean
  (`git status --porcelain` empty), `git fetch origin`, then
  `git switch -c <change> origin/main`. Change artifacts are never committed
  on `main`. The reviewed plan is committed to the branch as soon as the
  artifacts are complete; implementation starts on a new user request, and
  every later commit (one per task, plus the archive) stays on that branch.

rules:
  proposal:
    - A change starts from a user request or an explicit change name; never
      from a GitHub issue. Derive the name as a kebab-case slug (lowercase,
      non-alphanumerics collapsed to `-`, no `#`, no issue number).
    - The branch must already be `<change>` before the proposal is written.
      If the current branch differs, stop and create it from `origin/main`
      first.
    - Keep the proposal consistent with the request it came from; do not widen
      scope silently. If the request is too thin to propose from, say so
      instead of inventing scope.

  tasks:
    - Every task must be independently implementable, reviewable and committable.
      One task becomes exactly one commit, so a task that cannot stand alone as a
      commit is the wrong size.
    - Order tasks so the branch is never left in a broken state between commits.

operations:
  apply:
    guidance:
      - "Work one task at a time. After finishing a task and ticking its checkbox, stop and show the user the diff for review. Do not begin the next task before they have responded."
      - "Once the user approves a task's diff, commit and push it. The commit message must follow the standard format: `<short imperative message> (#<NUMBER>)` and include the `OpenSpec-Change: <change>` and `Agent: <agent>` trailer."
      - "After the last task, do not archive yourself. Ask the user to run the gh-change-ship skill instead"
