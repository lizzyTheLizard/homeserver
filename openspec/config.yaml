schema: spec-driven
context: |
  The change name, the branch name and the change folder are the same value:
  a kebab-case slug `<change>` used verbatim as `openspec/changes/<change>`
  and as branch `<change>`. Never work on a change while a different branch
  is checked out.

  Before the first artifact exists: the working tree is clean
  (`git status --porcelain` empty), `git fetch origin`, then
  `git switch -c <change> origin/main`. Change artifacts are never committed
  on `main`. 
rules:
  proposal:
    - A change starts from a user request or an explicit change name.
      Derive the name as a kebab-case slug (lowercase,
      non-alphanumerics collapsed to `-`, no `#`).
    - The branch must already be `<change>` before the proposal is written.
      If the current branch differs, stop and create it from `origin/main`
      first.
    - Keep the proposal consistent with the request it came from; do not widen
      scope silently. If the request is too thin to propose from, say so
      instead of inventing scope.
operations:
  apply:
    guidance:
      - "Implement all tasks of the change in one go. Work through them in order and tick each checkbox when its task is done. Do not stop for review between tasks, and do not commit or push per task. Pause only for a real blocker or an unclear task."
      - "After the last task, run lint and tests for the affected packages, then show the user the full diff of the change for a single review. Do not commit before they approve. If they ask for changes, make them and show the diff again."
      - "Once the user approves, commit and push once. The commit message must follow the standard format: `<short imperative message>` with the `OpenSpec-Change: <change>` and `Agent: <agent>` trailers. Do not add an issue number."
      - "Do not archive yourself. Ask the user to run the openspec-archive-change workflow instead."
  archive:
    guidance:
      - "Always sync the change's delta specs into `openspec/specs/` before archiving. Do not ask whether to sync."
      - "Commit the archive isolated to `openspec/`: stage `-A openspec`, make sure nothing else is staged, and commit as `Archive <change>` with the `OpenSpec-Change: <change>` and `Agent: <agent>` trailers. Then push the branch."
      - "Open the pull request from the change branch to `main` with `gh pr create --body-file`: a `## Summary` heading, 2-4 bullets, an `OpenSpec-Change: <change>` line and a link to the archived proposal at `openspec/changes/archive/<date>-<change>/proposal.md`. Do not add a `Closes` line or an issue number."
      - "Arm auto-merge with `gh pr merge --auto --squash` and report the PR URL. Then follow the PR until it has merged: watch the checks with `gh pr checks --watch` and confirm with `gh pr view --json state,mergeStateStatus` that its state is `MERGED`."
      - "If a check fails or the PR cannot merge, read the failing job's log (`gh run view --log-failed`) and fix the cause in the working tree on the change branch. Never commit or push such a fix on your own: show the user the diff, and only after they approve, commit (same trailers) and push. Then keep following the PR."
      - "If a check fails with no clear cause in the code, for example a flaky or infrastructure failure, re-run it once with `gh run rerun --failed`. If it fails again, report it to the user instead of guessing a fix."
