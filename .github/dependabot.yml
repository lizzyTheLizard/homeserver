version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 1

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories:
      - "/services/web"
      - "/services/assistant"
      - "/services/whatsapp"
      - "/services/wichteln"
      - "/services/dev-machine"
      - "/infrastructure/db-backup"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1

  - package-ecosystem: "docker-compose"
    directory: "/infrastructure"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    ignore:
      # A major upgrade needs a data migration and a matching postgresql client in infrastructure/db-backup
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
