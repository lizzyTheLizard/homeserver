name: 'CI'
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  # Runs queue so a deploy is never interrupted
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: web
            service: web
            image: homeserver-web
            revision-build-args: true
          - name: Wichteln
            service: wichteln
            image: homeserver-wichteln
            revision-build-args: false
          - name: backup
            service: backup
            image: homeserver-backup
            revision-build-args: false
          - name: dev machine
            service: dev-machine
            image: homeserver-dev-machine
            revision-build-args: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Revision build arguments
        id: revision
        if: matrix.revision-build-args
        run: |
          {
            echo "args<<EOF"
            echo "GIT_COMMIT_HASH=${{ github.sha }}"
            echo "GIT_BRANCH=${{ github.ref_name }}"
            echo "GITHUB_RUN_ID=${{ github.run_id }}"
            echo "BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/lizzythelizard/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.visibility=public
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}
          build-args: ${{ steps.revision.outputs.args }}
  deploy-infrastructure:
    name: Deploy infrastructure
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add host key to known hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Sync infrastructure files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: rsync -avz ./infrastructure/ "$SSH_USER@$SSH_HOST:/opt/homeserver/"
      - name: Pull and recreate the whole stack
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        # Serialize deploys on the host: parallel deploys racing on pull/prune break each other's image leases
        run: |
          ssh "$SSH_USER@$SSH_HOST" "flock -w 900 /tmp/homeserver-deploy.lock sh -c 'set -e; cd /opt/homeserver; docker compose pull; docker compose up -d --force-recreate --remove-orphans; docker image prune -f'"
