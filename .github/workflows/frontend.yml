name: "Frontend"
on: 
  push:
    paths:
    - '*'
    - 'webcomponents/**'
    - 'frontend/**'
    - '.github/**'
  pull_request:
jobs:
  buildwc:
    name: Build WebComponents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Minio Deploy
        uses: lovellfelix/minio-deploy-action@v1
        with:
          endpoint: https://s3.fr-par.scw.cloud
          access_key: ${{ secrets.MINIO_ACCESS_KEY }}
          secret_key: ${{ secrets.MINIO_SECRET_KEY }}
          bucket: 'homeserver-frontend'
          source_dir: 'frontend/app/'
          target_dir: '/'
      - name: Setup
        uses: ./.github/actions/setup
      - name: Cache Webcomponents
        id: cache-webcomponents
        uses: actions/cache@v4
        with:
          path: webcomponents
          key: wc-${{ hashFiles('webcomponents/**') }}
      - name: Build
        if: steps.cache-webcomponents.outputs.cache-hit != 'true'
        run: pnpm -F homeserver-webcomponents run build
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: buildwc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Cache Webcomponents
        uses: actions/cache@v4
        with:
          path: webcomponents
          key: wc-${{ hashFiles('webcomponents/**') }}
      - name: Lint
        run: pnpm -F homeserver-frontend run lint
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: buildwc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Cache Webcomponents
        uses: actions/cache@v4
        with:
          path: webcomponents
          key: wc-${{ hashFiles('webcomponents/**') }}
      - name: Run Tests
        run: pnpm -F homeserver-frontend run test
  build:
    name: Build
    needs: buildwc
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Cache Webcomponents
        uses: actions/cache@v4
        with:
          path: webcomponents
          key: wc-${{ hashFiles('webcomponents/**') }}
      - name: Cache Build Output
        uses: actions/cache@v4
        with:
          path: frontend/build/client
          key: fe-${{ hashFiles('frontend/**') }}
      - name: Build
        run: pnpm -F homeserver-frontend run build
  deploy:
    name: Deploy
    needs: [build, test, lint]
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Cache Build Output
        uses: actions/cache@v4
        with:
          path: frontend/build/client
          key: fe-${{ hashFiles('frontend/**') }}
