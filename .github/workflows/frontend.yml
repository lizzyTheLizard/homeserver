name: "Frontend"
on: 
  push:
    paths:
    - '*'
    - 'webcomponents/**'
    - 'frontend/**'
    - '.github/**'
  pull_request:
jobs:
  buildwc:
    name: Build WebComponents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build
        run: pnpm -F homeserver-webcomponents run build
      - name: Upload Webcomponents Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webcomponents
          path: webcomponents/build
          retention-days: 1
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: buildwc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Download Webcomponents Artifact
        uses: actions/download-artifact@v4
        with:
          name: webcomponents
          path: webcomponents/build
      - name: Lint
        run: pnpm -F homeserver-frontend run lint
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: buildwc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Download Webcomponents Artifact
        uses: actions/download-artifact@v4
        with:
          name: webcomponents
          path: webcomponents/build
      - name: Run Tests
        run: pnpm -F homeserver-frontend run test
  build:
    name: Build
    needs: buildwc
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Download Webcomponents Artifact
        uses: actions/download-artifact@v4
        with:
          name: webcomponents
          path: webcomponents/build
      - name: Build
        run: pnpm -F homeserver-frontend run build
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend/build/client
          retention-days: 1
  deploy:
    name: Deploy
    needs: [build, test, lint]
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend
          path: frontend/build/client
      - name: Minio Deploy
        uses: lovellfelix/minio-deploy-action@v1
        with:
          endpoint: https://s3.fr-par.scw.cloud
          access_key: ${{ secrets.MINIO_ACCESS_KEY }}
          secret_key: ${{ secrets.MINIO_SECRET_KEY }}
          bucket: 'homeserver-frontend'
          source_dir: 'frontend/build/client'
          target_dir: '/'
