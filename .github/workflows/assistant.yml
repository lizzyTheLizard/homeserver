name: "Assistant"
on:
  pull_request:
    paths:
      - 'services/assistant/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - 'services/assistant/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'infrastructure/**'
  workflow_dispatch:
jobs:
  lint:
    name: Lint Assistant
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/assistant
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: pnpm run lint:ci
  test:
    name: Test Assistant
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/assistant
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Tests
        run: pnpm test
  build:
    name: Build and publish Assistant image
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            branch="${{ github.head_ref }}"
            [ -n "$branch" ] || branch="${{ github.ref_name }}"
            echo "tag=$(echo "$branch" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish
        uses: ./.github/actions/build-publish
        with:
          image: homeserver-assistant
          dockerfile: services/assistant/Dockerfile
          tag: ${{ steps.tag.outputs.tag }}
  deploy:
    name: Deploy Assistant
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Deploy service
        uses: ./.github/actions/deploy-service
        with:
          service: assistant
