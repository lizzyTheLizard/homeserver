name: "Assistant"
on:
  pull_request:
    paths:
      - 'services/assistant/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - 'services/assistant/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'infrastructure/**'
  workflow_dispatch:
jobs:
  test:
    name: Test Assistant
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/assistant
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Tests
        run: pnpm test
  build:
    name: Build and publish Assistant image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and publish
        uses: ./.github/actions/build-publish
        with:
          image: homeserver-assistant
          dockerfile: services/assistant/Dockerfile
  deploy:
    name: Deploy Assistant
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Deploy service
        uses: ./.github/actions/deploy-service
        with:
          service: assistant
