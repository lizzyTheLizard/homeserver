name: "WhatsApp"
on:
  push:
    paths:
      - 'services/whatsapp/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
jobs:
  test:
    name: Test WhatsApp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/whatsapp
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Tests
        run: pnpm test
  build:
    name: Build and publish WhatsApp image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and publish
        uses: ./.github/actions/build-publish
        with:
          image: homeserver-whatsapp
          dockerfile: services/whatsapp/Dockerfile
  deploy:
    name: Deploy WhatsApp
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Deploy service
        uses: ./.github/actions/deploy-service
        with:
          service: whatsapp
