name: "Web"
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - 'services/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
jobs:
  detect:
    name: Detect Web changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changes
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE '^(services/web/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)'; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  lint:
    name: Lint Web
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    defaults:
      run:
        working-directory: ./services/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: pnpm run lint:ci
  test:
    name: Test Web (unit + integration + storybook)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    defaults:
      run:
        working-directory: ./services/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
      - name: Unit tests
        run: pnpm run test --project unit
      - name: Integration tests
        run: pnpm run test --project integration
      - name: Storybook tests
        run: pnpm run test --project storybook
  build:
    name: Build and publish Web image
    runs-on: ubuntu-latest
    needs: [detect, lint, test]
    if: needs.detect.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Get Datetime
        id: get-datetime
        run: echo "datetime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        uses: ./.github/actions/build-publish
        with:
          image: homeserver-web
          dockerfile: services/web/Dockerfile
          build-args: |
            GIT_COMMIT_HASH=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            GITHUB_RUN_ID=${{ github.run_id }}
            BUILD_TIME=${{ steps.get-datetime.outputs.datetime }}
  deploy:
    name: Deploy Web
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Deploy service
        uses: ./.github/actions/deploy-service
        with:
          service: applicationprod
  gate:
    name: Gate Web
    runs-on: ubuntu-latest
    needs: [detect, lint, test, build]
    if: always()
    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.detect.outputs.changed }}" = "true" ]; then
            if [[ "${{ needs.lint.result }}" != "success" || "${{ needs.test.result }}" != "success" || "${{ needs.build.result }}" != "success" ]]; then
              echo "A required job did not succeed"
              exit 1
            fi
          fi
          echo "Gate passed"
