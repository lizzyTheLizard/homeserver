name: "Dev Machine"
on:
  pull_request:
    paths:
      - 'services/dev-machine/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - 'services/dev-machine/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'infrastructure/**'
  workflow_dispatch:
jobs:
  build:
    name: Build and publish Dev Machine image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            branch="${{ github.head_ref }}"
            [ -n "$branch" ] || branch="${{ github.ref_name }}"
            echo "tag=$(echo "$branch" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish
        uses: ./.github/actions/build-publish
        with:
          image: homeserver-dev-machine
          dockerfile: services/dev-machine/Dockerfile
          tag: ${{ steps.tag.outputs.tag }}
  deploy:
    name: Deploy Dev Machine
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Deploy service
        uses: ./.github/actions/deploy-service
        with:
          service: dev-machine
