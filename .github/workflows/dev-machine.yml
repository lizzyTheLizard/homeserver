name: "Dev Machine"
on:
  pull_request:
    paths:
      - 'services/dev-machine/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - 'services/dev-machine/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'infrastructure/**'
  workflow_dispatch:
jobs:
  build:
    name: Build and publish Dev Machine image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and publish
        uses: ./.github/actions/build-publish
        with:
          image: homeserver-dev-machine
          dockerfile: services/dev-machine/Dockerfile
  deploy:
    name: Deploy Dev Machine
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Deploy service
        uses: ./.github/actions/deploy-service
        with:
          service: dev-machine
