name: "Dev Machine"
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - 'services/dev-machine/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
jobs:
  detect:
    name: Detect Dev Machine changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changes
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE '^(services/dev-machine/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)'; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    name: Build and publish Dev Machine image
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and publish
        uses: ./.github/actions/build-publish
        with:
          image: homeserver-dev-machine
          dockerfile: services/dev-machine/Dockerfile
          token: ${{ secrets.GITHUB_TOKEN }}
  deploy:
    name: Deploy Dev Machine
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Deploy service
        uses: ./.github/actions/deploy-service
        with:
          service: dev-machine
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
  gate:
    name: Gate Dev Machine
    runs-on: ubuntu-latest
    needs: [detect, build]
    if: always()
    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.detect.outputs.changed }}" = "true" ]; then
            if [[ "${{ needs.build.result }}" != "success" ]]; then
              echo "A required job did not succeed"
              exit 1
            fi
          fi
          echo "Gate passed"
