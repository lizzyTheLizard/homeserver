name: 'Pull request'
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: pull-request-${{ github.ref }}
  # A superseded run is cancelled
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: pnpm run lint:ci
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.detect.outputs.web }}
      wichteln: ${{ steps.detect.outputs.wichteln }}
      dev-machine: ${{ steps.detect.outputs['dev-machine'] }}
      infrastructure: ${{ steps.detect.outputs.infrastructure }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      - name: Detect changes
        id: detect
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node .github/scripts/detect-changes.mjs
  change-guard:
    name: Change guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      - name: Test pipeline scripts
        run: node --test '.github/scripts/*.test.mjs'
      - name: Check the pull request carries an archived, synced change
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: origin/${{ github.base_ref }}
        run: node .github/scripts/change-guard.mjs
  test-web:
    name: Test web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Read the Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps
      - name: Tests
        run: |
          pnpm run test --project unit
          pnpm run test --project integration
          pnpm run test --project storybook
  test-wichteln:
    name: Test Wichteln
    needs: changes
    if: needs.changes.outputs.wichteln == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/wichteln
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Tests
        run: pnpm test
  stack-start:
    name: Start stack
    runs-on: ubuntu-latest
    needs: changes
    # Documentation-only pull requests change no service and not the infrastructure
    if: >-
      ${{ needs.changes.outputs.web == 'true'
      || needs.changes.outputs.wichteln == 'true'
      || needs.changes.outputs['dev-machine'] == 'true'
      || needs.changes.outputs.infrastructure == 'true' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build time
        id: build-time
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Build the web image
        if: needs.changes.outputs.web == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/web/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/lizzythelizard/homeserver-web:latest
          cache-from: type=gha,scope=homeserver-web
          cache-to: type=gha,mode=min,scope=homeserver-web
          build-args: |
            GIT_COMMIT_HASH=${{ github.sha }}
            GIT_BRANCH=${{ github.head_ref }}
            GITHUB_RUN_ID=${{ github.run_id }}
            BUILD_TIME=${{ steps.build-time.outputs.value }}
      - name: Build the Wichteln image
        if: needs.changes.outputs.wichteln == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/wichteln/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/lizzythelizard/homeserver-wichteln:latest
          cache-from: type=gha,scope=homeserver-wichteln
          cache-to: type=gha,mode=min,scope=homeserver-wichteln
      - name: Build the dev machine image
        if: needs.changes.outputs['dev-machine'] == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/dev-machine/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/lizzythelizard/homeserver-dev-machine:latest
          cache-from: type=gha,scope=homeserver-dev-machine
          cache-to: type=gha,mode=min,scope=homeserver-dev-machine
      - name: Free port 53 for the name server
        # The runner's local resolver stub listens on port 53, which the stack publishes.
        # Only the stub listener is turned off; name resolution keeps working through the upstream servers.
        run: |
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '[Resolve]\nDNSStubListener=no\n' | sudo tee /etc/systemd/resolved.conf.d/no-stub.conf
          sudo ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf
          sudo systemctl restart systemd-resolved
          # The Docker daemon keeps the old 127.0.0.53 resolver until it is restarted
          sudo systemctl restart docker
          getent hosts registry-1.docker.io
          sudo ss -lntup | grep ':53 ' || true
      - name: Use the placeholder configuration
        run: |
          cp infrastructure/env.example infrastructure/.env
          # The development machine would otherwise exit without a GitHub SSH key
          echo "SKIP_GITHUB_BOOTSTRAP=1" >> infrastructure/.env
      - name: Create placeholder TLS certificates
        # nginx refuses to start without the certificates that certbot issues on the real host
        run: |
          for host in dev logs www wichteln; do
            dir="infrastructure/certbot/conf/live/$host.gutschi.site"
            mkdir -p "$dir"
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=$host.gutschi.site" \
              -keyout "$dir/privkey.pem" -out "$dir/fullchain.pem"
          done
      - name: Pull the published images of everything not built here
        working-directory: infrastructure
        env:
          WEB: ${{ needs.changes.outputs.web }}
          WICHTELN: ${{ needs.changes.outputs.wichteln }}
          DEV_MACHINE: ${{ needs.changes.outputs['dev-machine'] }}
        run: |
          built=""
          [ "$WEB" = true ] && built="$built applicationprod"
          [ "$WICHTELN" = true ] && built="$built wichteln"
          [ "$DEV_MACHINE" = true ] && built="$built dev-machine"
          services=$(docker compose config --services | grep -vxF -f <(printf '%s\n' $built) || true)
          docker compose pull --ignore-buildable $services
      - name: Start the stack and wait until every container is healthy
        working-directory: infrastructure
        # The images built above already exist locally, so compose keeps them instead of pulling the published ones
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Show container state and logs
        if: ${{ failure() }}
        working-directory: infrastructure
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100
      - name: Stop the stack
        if: ${{ always() }}
        working-directory: infrastructure
        run: docker compose down -v --remove-orphans
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, changes, change-guard, test-web, test-wichteln, stack-start]
    # Always runs, even when every earlier job failed, was cancelled or was skipped
    if: always()
    steps:
      - name: Show job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"
      - name: Fail if a job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A job failed or was cancelled"
          exit 1
      - name: Quality Gate passed
        run: echo "Every job succeeded or was skipped"
