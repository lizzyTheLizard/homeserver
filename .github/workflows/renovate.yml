name: "Renovate"
on:
  schedule:
    # 03:00 UTC is 04:00 or 05:00 in Zurich; the timing of all runs is decided here, renovate.json5 has no schedule
    - cron: "0 3 * * *"
  push:
    # Under the strict ruleset every merge leaves the other pull requests behind main; Renovate rebases them
    branches: [main]
  workflow_dispatch:
    inputs:
      log-level:
        description: "Renovate log level"
        type: choice
        options: [info, debug]
        default: info
concurrency:
  group: renovate
  # Two runs would race on the same branches; a queued run starts after the current one
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Renovate
        uses: renovatebot/github-action@v47.0.0
        with:
          # Not GITHUB_TOKEN: pushes and merges made with it start no pipeline run
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          # An address of the owner instead of the default one of Mend (renovate@whitesourcesoftware.com)
          RENOVATE_GIT_AUTHOR: "lizzyTheLizard <14069652+lizzyTheLizard@users.noreply.github.com>"
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
