name: Update Dependabot PRs

# The ruleset on main requires pull requests to be up to date, and Dependabot only rebases on conflicts.
# After every push to main this brings one Dependabot pull request with armed auto-merge up to date, so
# auto-merge can finish. Each merge pushes to main and so starts the next update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-update-branch

jobs:
  update-branch:
    name: Update the oldest Dependabot PR that is behind main
    runs-on: ubuntu-latest
    steps:
      # A push made with GITHUB_TOKEN starts no workflow run; a push made by the app does
      - name: Get GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Update the oldest behind PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          armed_filter='[.[] | select(.author.is_bot and (.author.login | test("dependabot"))) | select(.autoMergeRequest != null)]'
          failed_filter='any(.statusCheckRollup[]?; (.conclusion // .state) as $c | $c == "FAILURE" or $c == "ERROR" or $c == "TIMED_OUT" or $c == "CANCELLED" or $c == "ACTION_REQUIRED" or $c == "STARTUP_FAILURE")'

          # GitHub works out the merge state lazily right after a push; give it a moment
          for attempt in 1 2 3 4; do
            prs=$(gh pr list --state open --limit 100 --json number,author,autoMergeRequest,mergeStateStatus,statusCheckRollup)
            unknown=$(jq "$armed_filter | map(select(.mergeStateStatus == \"UNKNOWN\")) | length" <<< "$prs")
            [ "$unknown" -eq 0 ] && break
            sleep 10
          done

          # An up-to-date PR that has not failed will merge and start the next run
          waiting=$(jq "$armed_filter | map(select(.mergeStateStatus != \"BEHIND\" and .mergeStateStatus != \"DIRTY\" and (($failed_filter) | not))) | map(.number)" <<< "$prs")
          if [ "$(jq length <<< "$waiting")" -gt 0 ]; then
            echo "Waiting for PR(s) $(jq -r 'join(", ")' <<< "$waiting"), not updating another one"
            exit 0
          fi

          next=$(jq "$armed_filter | map(select(.mergeStateStatus == \"BEHIND\")) | sort_by(.number) | first | .number // empty" <<< "$prs")
          if [ -z "$next" ]; then
            echo "No Dependabot PR with armed auto-merge is behind main"
            exit 0
          fi
          echo "Updating PR #$next"
          gh pr update-branch "$next"
