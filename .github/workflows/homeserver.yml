name: "Homeserver"
on: 
    push:
    workflow_dispatch:
jobs:
    lint:
        name: Lint (All)
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Setup
            uses: ./.github/actions/setup
          - name: Lint
            run: pnpm run lint:ci
    test-assistant:
        name: Test Assistant
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: ./assistant
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Setup
            uses: ./.github/actions/setup
          - name: Tests
            run: pnpm test
    test-web-unit:
        name: Test Web (Unit)
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: ./web
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Setup
            uses: ./.github/actions/setup
          - name: Tests
            run: pnpm run test --project unit
    test-web-integration:
        name: Test Web (Integration)
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: ./web
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Setup
            uses: ./.github/actions/setup
          - name: Tests
            run: pnpm run test --project integration
    test-web-storybook:
        name: Test Web (Storybook)
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: ./web
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Setup
            uses: ./.github/actions/setup
          - name: Cache Playwright Browsers
            uses: actions/cache@v6
            id: playwright-cache
            with:
                path: ~/.cache/ms-playwright
                key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          - name: Install Playwright Browsers
            run: pnpm exec playwright install --with-deps
            if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
          - name: Tests
            run: pnpm run test --project storybook
    test-whatsapp:
        name: Test WhatsApp Bridge
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: ./whatsapp-bridge
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Setup
            uses: ./.github/actions/setup
          - name: Tests
            run: pnpm test
    build-app:
        name: Build Application Docker Container
        runs-on: ubuntu-latest        
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4
          - name: Get Datetime
            run: echo "datetime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
            id: get-datetime
          - name: Build Docker
            uses: docker/build-push-action@v7
            with:
              context: .
              file: web/Dockerfile
              platforms: linux/amd64
              push: false
              tags: homeserver:latest
              cache-from: type=gha
              cache-to: type=gha,mode=min
              outputs: type=docker,dest=${{ runner.temp }}/homeserver.tar
              build-args: |
                GIT_COMMIT_HASH=${{ github.sha }}
                GIT_BRANCH=${{ github.ref_name }}
                GITHUB_RUN_ID=${{ github.run_id }}
                BUILD_TIME=${{ steps.get-datetime.outputs.datetime }}
            env:
              DOCKER_BUILD_RECORD_UPLOAD: false
          - name: Upload artifact
            uses: actions/upload-artifact@v7
            with:
              name: homeserver
              path: ${{ runner.temp }}/homeserver.tar
              retention-days: 1
    build-whatsapp:
        name: Build WhatsApp Bridge Docker Container
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4
          - name: Build Docker
            uses: docker/build-push-action@v7
            with:
              context: .
              file: whatsapp-bridge/Dockerfile
              platforms: linux/amd64
              push: false
              tags: whatsapp-bridge:latest
              cache-from: type=gha
              cache-to: type=gha,mode=min
              outputs: type=docker,dest=${{ runner.temp }}/whatsapp-bridge.tar
            env:
              DOCKER_BUILD_RECORD_UPLOAD: false
          - name: Upload artifact
            uses: actions/upload-artifact@v7
            with:
              name: whatsapp-bridge
              path: ${{ runner.temp }}/whatsapp-bridge.tar
              retention-days: 1
    build-assistant:
        name: Build Assistant Docker Container
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4
          - name: Build Docker
            uses: docker/build-push-action@v7
            with:
              context: .
              file: assistant/Dockerfile
              platforms: linux/amd64
              push: false
              tags: homeserver-assistant:latest
              cache-from: type=gha
              cache-to: type=gha,mode=min
              outputs: type=docker,dest=${{ runner.temp }}/homeserver-assistant.tar
            env:
              DOCKER_BUILD_RECORD_UPLOAD: false
          - name: Upload artifact
            uses: actions/upload-artifact@v7
            with:
              name: homeserver-assistant
              path: ${{ runner.temp }}/homeserver-assistant.tar
              retention-days: 1
    build-dev-machine:
        name: Build Dev Machine Docker Container
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4
          - name: Build Docker
            uses: docker/build-push-action@v7
            with:
              context: .
              file: dev-machine/Dockerfile
              platforms: linux/amd64
              push: false
              tags: homeserver-dev-machine:latest
              cache-from: type=gha
              cache-to: type=gha,mode=max
              outputs: type=docker,dest=${{ runner.temp }}/homeserver-dev-machine.tar
            env:
              DOCKER_BUILD_RECORD_UPLOAD: false
          - name: Upload artifact
            uses: actions/upload-artifact@v7
            with:
              name: homeserver-dev-machine
              path: ${{ runner.temp }}/homeserver-dev-machine.tar
              retention-days: 1
    integration-smoke:
        name: Integration Smoke (docker-compose stack)
        runs-on: ubuntu-latest
        needs: [build-app, build-whatsapp, build-assistant, build-dev-machine]
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Setup
            uses: ./.github/actions/setup
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4
          - name: Download application artifact
            uses: actions/download-artifact@v8
            with:
              name: homeserver
              path: ${{ runner.temp }}
          - name: Download WhatsApp bridge artifact
            uses: actions/download-artifact@v8
            with:
              name: whatsapp-bridge
              path: ${{ runner.temp }}
          - name: Download assistant artifact
            uses: actions/download-artifact@v8
            with:
              name: homeserver-assistant
              path: ${{ runner.temp }}
          - name: Download dev-machine artifact
            uses: actions/download-artifact@v8
            with:
              name: homeserver-dev-machine
              path: ${{ runner.temp }}
          - name: Load Docker images
            run: |
              docker load --input ${{ runner.temp }}/homeserver.tar
              docker load --input ${{ runner.temp }}/whatsapp-bridge.tar
              docker load --input ${{ runner.temp }}/homeserver-assistant.tar
              docker load --input ${{ runner.temp }}/homeserver-dev-machine.tar
          - name: Cache third-party Docker images
            uses: actions/cache@v6
            id: third-party-images
            with:
              path: ${{ runner.temp }}/third-party-images
              key: third-party-images-${{ hashFiles('infrastructure/docker-compose.yml', 'integration-test/docker-compose.ci.yml') }}
          - name: Load cached third-party Docker images
            if: ${{ steps.third-party-images.outputs.cache-hit == 'true' }}
            run: |
              for f in ${{ runner.temp }}/third-party-images/*.tar; do
                [ -f "$f" ] && docker load --input "$f" || true
              done
          - name: Cache Playwright Browsers
            uses: actions/cache@v6
            id: playwright-cache
            with:
              path: ~/.cache/ms-playwright
              key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          - name: Install Playwright Browsers
            run: pnpm exec playwright install --with-deps chromium
            if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
          - name: Map smoke hosts to localhost
            run: |
              sudo tee -a /etc/hosts > /dev/null << 'EOF'
              127.0.0.1 dev.gutschi.site
              127.0.0.1 www.gutschi.site
              127.0.0.1 logs.gutschi.site
              127.0.0.1 mock-oidc-server
              EOF
          - name: Generate self-signed certificates
            run: pnpm --filter @homeserver/integration-test certs
          - name: Create project .env for compose interpolation
            run: |
              if [ ! -f infrastructure/.env ]; then
                cp integration-test/env.test infrastructure/.env
              fi
          - name: Build backup image
            uses: docker/build-push-action@v7
            with:
              context: infrastructure/db-backup
              file: infrastructure/db-backup/Dockerfile
              load: true
              tags: homeserver-backup:latest
              cache-from: type=gha,scope=smoke-backup
              cache-to: type=gha,mode=max,scope=smoke-backup
          - name: Build mock-oidc-server image
            uses: docker/build-push-action@v7
            with:
              context: integration-test/mock-oidc
              file: integration-test/mock-oidc/Dockerfile
              load: true
              tags: homeserver-mock-oidc:latest
              cache-from: type=gha,scope=smoke-mock-oidc
              cache-to: type=gha,mode=max,scope=smoke-mock-oidc
          - name: Start smoke stack
            run: docker compose -f infrastructure/docker-compose.yml -f integration-test/docker-compose.ci.yml up -d --no-build --wait --wait-timeout 300 --remove-orphans
            env:
              AI_API_KEY: ${{ secrets.AI_API_KEY }}
              BUILDKIT_INLINE_CACHE: "1"
          - name: Save third-party Docker images for cache
            if: ${{ steps.third-party-images.outputs.cache-hit != 'true' }}
            run: |
              mkdir -p "${{ runner.temp }}/third-party-images"
              for img in nginx:alpine postgres:16-alpine sosedoff/pgweb amir20/dozzle:latest caddy:2-alpine ubuntu/bind9:latest certbot/certbot:latest node:24-alpine ubuntu:24.04; do
                if docker image inspect "$img" >/dev/null 2>&1; then
                  docker save "$img" --output "${{ runner.temp }}/third-party-images/$(echo "$img" | tr '/:' '__').tar"
                fi
              done
          - name: Run smoke checks
            run: pnpm --filter @homeserver/integration-test test
          - name: Dump smoke stack logs
            if: failure()
            run: docker compose -f infrastructure/docker-compose.yml -f integration-test/docker-compose.ci.yml logs --no-color --timestamps
          - name: Tear down smoke stack
            if: always()
            run: docker compose -f infrastructure/docker-compose.yml -f integration-test/docker-compose.ci.yml down --remove-orphans -v
    all-build-checks:
        name: All Build Check Success
        runs-on: ubuntu-latest
        needs: [lint, test-assistant, test-web-unit, test-web-integration, test-web-storybook, test-whatsapp, build-app, build-whatsapp, build-assistant, build-dev-machine, integration-smoke]
        if: always()
        steps:
          - name: Fail if any required job failed or was cancelled
            if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
            run: exit 1
          - name: All checks passed
            run: echo "All lint, test, build and integration smoke checks passed."
    deploy:
        name: Restart Homeserver Stack
        needs: [all-build-checks]
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'        
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Download application artifact
            uses: actions/download-artifact@v8
            with:
              name: homeserver
              path: ${{ runner.temp }}
          - name: Download WhatsApp bridge artifact
            uses: actions/download-artifact@v8
            with:
              name: whatsapp-bridge
              path: ${{ runner.temp }}
          - name: Download assistant artifact
            uses: actions/download-artifact@v8
            with:
              name: homeserver-assistant
              path: ${{ runner.temp }}
          - name: Download dev-machine artifact
            uses: actions/download-artifact@v8
            with:
              name: homeserver-dev-machine
              path: ${{ runner.temp }}
          - name: Set up SSH key
            uses: webfactory/ssh-agent@v0.10.0
            with:
              ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          - name: Add Host Key to Known Hosts
            run: |
              mkdir -p ~/.ssh
              ssh-keyscan ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          - name: Sync compose, infrastructure files and images
            run: |
              rsync -avz ./infrastructure/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/homeserver/
              rsync -avz ${{ runner.temp }}/homeserver.tar ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/homeserver/
              rsync -avz ${{ runner.temp }}/whatsapp-bridge.tar ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/homeserver/
              rsync -avz ${{ runner.temp }}/homeserver-assistant.tar ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/homeserver/
              rsync -avz ${{ runner.temp }}/homeserver-dev-machine.tar ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/homeserver/
          - name: Load images and restart stack
            run: |
              ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
                set -e
                cd /opt/homeserver
                docker load --input homeserver.tar
                docker load --input whatsapp-bridge.tar
                docker load --input homeserver-assistant.tar
                docker load --input homeserver-dev-machine.tar
                rm -f homeserver.tar whatsapp-bridge.tar homeserver-assistant.tar homeserver-dev-machine.tar
                docker compose up -d --build --force-recreate --remove-orphans
                docker image prune -f
              EOF
          - name: Wait for stack to become healthy
            run: |
              ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
                set -e
                cd /opt/homeserver
                timeout 180s bash -c '
                  while true; do
                    bad=0
                    for cid in $(docker compose ps -q); do
                      state=$(docker inspect -f "{{.State.Status}}" "$cid")
                      health=$(docker inspect -f "{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}" "$cid")
                      if [ "$state" != "running" ]; then bad=1; break; fi
                      if [ "$health" != "none" ] && [ "$health" != "healthy" ]; then bad=1; break; fi
                    done
                    if [ "$bad" -eq 0 ]; then
                      echo "All containers are running and healthy."
                      break
                    fi
                    echo "Waiting for containers to become healthy..."
                    sleep 5
                  done
                '
              EOF
