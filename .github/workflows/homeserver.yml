name: "Homeserver"
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  change-guard:
    name: Change guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      - name: Check the pull request carries an archived change
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/change-guard.mjs
  lint:
    name: Lint (All)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: pnpm run lint:ci
  build-web:
    name: Build Web Docker Container
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Get Datetime
        id: get-datetime
        run: echo "datetime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Build Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/web/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ghcr.io/lizzythelizard/homeserver-web:latest
          cache-from: type=gha,scope=homeserver-web
          cache-to: type=gha,mode=min,scope=homeserver-web
          outputs: type=docker,dest=${{ runner.temp }}/homeserver-web.tar
          build-args: |
            GIT_COMMIT_HASH=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            GITHUB_RUN_ID=${{ github.run_id }}
            BUILD_TIME=${{ steps.get-datetime.outputs.datetime }}
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: homeserver-web
          path: ${{ runner.temp }}/homeserver-web.tar
          retention-days: 1
  build-assistant:
    name: Build Assistant Docker Container
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/assistant/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ghcr.io/lizzythelizard/homeserver-assistant:latest
          cache-from: type=gha,scope=homeserver-assistant
          cache-to: type=gha,mode=min,scope=homeserver-assistant
          outputs: type=docker,dest=${{ runner.temp }}/homeserver-assistant.tar
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: homeserver-assistant
          path: ${{ runner.temp }}/homeserver-assistant.tar
          retention-days: 1
  build-whatsapp:
    name: Build WhatsApp Docker Container
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/whatsapp/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ghcr.io/lizzythelizard/homeserver-whatsapp:latest
          cache-from: type=gha,scope=homeserver-whatsapp
          cache-to: type=gha,mode=min,scope=homeserver-whatsapp
          outputs: type=docker,dest=${{ runner.temp }}/homeserver-whatsapp.tar
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: homeserver-whatsapp
          path: ${{ runner.temp }}/homeserver-whatsapp.tar
          retention-days: 1
  build-wichteln:
    name: Build Wichteln Docker Container
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/wichteln/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ghcr.io/lizzythelizard/homeserver-wichteln:latest
          cache-from: type=gha,scope=homeserver-wichteln
          cache-to: type=gha,mode=min,scope=homeserver-wichteln
          outputs: type=docker,dest=${{ runner.temp }}/homeserver-wichteln.tar
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: homeserver-wichteln
          path: ${{ runner.temp }}/homeserver-wichteln.tar
          retention-days: 1
  build-dev-machine:
    name: Build Dev Machine Docker Container
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/dev-machine/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ghcr.io/lizzythelizard/homeserver-dev-machine:latest
          cache-from: type=gha,scope=homeserver-dev-machine
          cache-to: type=gha,mode=min,scope=homeserver-dev-machine
          outputs: type=docker,dest=${{ runner.temp }}/homeserver-dev-machine.tar
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: homeserver-dev-machine
          path: ${{ runner.temp }}/homeserver-dev-machine.tar
          retention-days: 1
  integration-smoke:
    name: Integration Smoke (docker-compose stack)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [build-web, build-assistant, build-whatsapp, build-wichteln, build-dev-machine]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: homeserver-web
          path: ${{ runner.temp }}
      - name: Download assistant artifact
        uses: actions/download-artifact@v8
        with:
          name: homeserver-assistant
          path: ${{ runner.temp }}
      - name: Download WhatsApp artifact
        uses: actions/download-artifact@v8
        with:
          name: homeserver-whatsapp
          path: ${{ runner.temp }}
      - name: Download Wichteln artifact
        uses: actions/download-artifact@v8
        with:
          name: homeserver-wichteln
          path: ${{ runner.temp }}
      - name: Download dev-machine artifact
        uses: actions/download-artifact@v8
        with:
          name: homeserver-dev-machine
          path: ${{ runner.temp }}
      - name: Load Docker images
        run: |
          docker load --input ${{ runner.temp }}/homeserver-web.tar
          docker load --input ${{ runner.temp }}/homeserver-assistant.tar
          docker load --input ${{ runner.temp }}/homeserver-whatsapp.tar
          docker load --input ${{ runner.temp }}/homeserver-wichteln.tar
          docker load --input ${{ runner.temp }}/homeserver-dev-machine.tar
      - name: Cache third-party Docker images
        uses: actions/cache@v6
        id: third-party-images
        with:
          path: ${{ runner.temp }}/third-party-images
          key: third-party-images-${{ hashFiles('infrastructure/docker-compose.yml', 'integration-test/docker-compose.ci.yml') }}
      - name: Load cached third-party Docker images
        if: ${{ steps.third-party-images.outputs.cache-hit == 'true' }}
        run: |
          for f in ${{ runner.temp }}/third-party-images/*.tar; do
            [ -f "$f" ] && docker load --input "$f" || true
          done
      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright Browsers
        run: pnpm --filter @homeserver/integration-test exec playwright install --with-deps chromium
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
      - name: Map smoke hosts to localhost
        run: |
          sudo tee -a /etc/hosts > /dev/null << 'EOF'
          127.0.0.1 dev.gutschi.site
          127.0.0.1 www.gutschi.site
          127.0.0.1 logs.gutschi.site
          127.0.0.1 wichteln.gutschi.site
          127.0.0.1 mock-oidc-server
          EOF
      - name: Generate self-signed certificates
        run: pnpm --filter @homeserver/integration-test certs
      - name: Create project .env for compose interpolation
        run: |
          if [ ! -f infrastructure/.env ]; then
            cp integration-test/env.test infrastructure/.env
          fi
      - name: Start smoke stack
        run: docker compose -f infrastructure/docker-compose.yml -f integration-test/docker-compose.ci.yml up -d --wait --wait-timeout 300 --remove-orphans
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
      - name: Save third-party Docker images for cache
        if: ${{ steps.third-party-images.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "${{ runner.temp }}/third-party-images"
          for img in nginx:alpine postgres:16-alpine sosedoff/pgweb amir20/dozzle:latest caddy:2-alpine ubuntu/bind9:latest certbot/certbot:latest node:24-alpine; do
            if docker image inspect "$img" >/dev/null 2>&1; then
              docker save "$img" --output "${{ runner.temp }}/third-party-images/$(echo "$img" | tr '/:' '__').tar"
            fi
          done
      - name: Run smoke checks
        run: pnpm --filter @homeserver/integration-test test
      - name: Dump smoke stack logs
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yml -f integration-test/docker-compose.ci.yml logs --no-color --timestamps
      - name: Tear down smoke stack
        if: always()
        run: docker compose -f infrastructure/docker-compose.yml -f integration-test/docker-compose.ci.yml down --remove-orphans -v
  all-checks:
    name: All Build Check Success
    runs-on: ubuntu-latest
    needs: [lint, build-web, build-assistant, build-whatsapp, build-wichteln, build-dev-machine, integration-smoke]
    if: github.event_name != 'pull_request' && always()
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: All checks passed
        run: echo "All lint, build and integration smoke checks passed."
