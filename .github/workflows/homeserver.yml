name: "Homeserver"
on: 
    push:
    workflow_dispatch:
jobs:
    lint:
        name: Lint (All)
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Setup
            uses: ./.github/actions/setup
          - name: Lint
            run: pnpm run lint:ci
    test-assistant:
        name: Test Assistant
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: ./assitant
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Setup
            uses: ./.github/actions/setup
          - name: Tests
            run: pnpm --project test
    test-web-unit:
        name: Test Web (Unit)
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: ./web
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Setup
            uses: ./.github/actions/setup
          - name: Tests
            run: pnpm run test --project unit
    test-web-integration:
        name: Test Web (Integration)
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: ./web
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Setup
            uses: ./.github/actions/setup
          - name: Tests
            run: pnpm run test --project integration
    test-web-storybook:
        name: Test Web (Storybook)
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: ./web
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Setup
            uses: ./.github/actions/setup
          - name: Cache Playwright Browsers
            uses: actions/cache@v6
            id: playwright-cache
            with:
                path: ~/.cache/ms-playwright
                key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          - name: Install Playwright Browsers
            run: pnpm exec playwright install --with-deps
            if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
          - name: Tests
            run: pnpm run test --project storybook
    test-web-chromatic:
        name: Test Application (Chromatic)
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: ./web
        steps:
          - name: Checkout
            uses: actions/checkout@v7
            with:
               fetch-depth: 0
          - name: Setup
            uses: ./.github/actions/setup
          - name: Run Chromatic
            uses: chromaui/action@latest
            with:
              projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
              autoAcceptChanges: main
              exitZeroOnChanges: false
    test-whatsapp:
        name: Build and Test WhatsApp Bridge
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: whatsapp-bridge
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Setup Go
            uses: actions/setup-go@v7
            with:
              go-version-file: whatsapp-bridge/go.mod
              cache-dependency-path: whatsapp-bridge/go.sum
          - name: Build
            run: go build ./...
          - name: Vet
            run: go vet ./...
          - name: Test
            run: go test ./...
    build-app:
        name: Build Application Docker Container
        runs-on: ubuntu-latest        
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4
          - name: Get Datetime
            run: echo "datetime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
            id: get-datetime
          - name: Build Docker
            uses: docker/build-push-action@v7
            with:
              context: .
              file: web/Dockerfile
              platforms: linux/amd64
              push: false
              tags: homeserver:latest
              cache-from: type=gha
              cache-to: type=gha,mode=max 
              outputs: type=docker,dest=${{ runner.temp }}/homeserver.tar
              build-args: |
                GIT_COMMIT_HASH=${{ github.sha }}
                GIT_BRANCH=${{ github.ref_name }}
                GITHUB_RUN_ID=${{ github.run_id }}
                BUILD_TIME=${{ steps.get-datetime.outputs.datetime }}
            env:
              DOCKER_BUILD_RECORD_UPLOAD: false
          - name: Upload artifact
            uses: actions/upload-artifact@v7
            with:
              name: homeserver
              path: ${{ runner.temp }}/homeserver.tar
              retention-days: 1
    build-whatsapp:
        name: Build WhatsApp Bridge Docker Container
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4
          - name: Build Docker
            uses: docker/build-push-action@v7
            with:
              context: ./whatsapp-bridge
              platforms: linux/amd64
              push: false
              tags: whatsapp-bridge:latest
              cache-from: type=gha
              cache-to: type=gha,mode=max
              outputs: type=docker,dest=${{ runner.temp }}/whatsapp-bridge.tar
            env:
              DOCKER_BUILD_RECORD_UPLOAD: false
          - name: Upload artifact
            uses: actions/upload-artifact@v7
            with:
              name: whatsapp-bridge
              path: ${{ runner.temp }}/whatsapp-bridge.tar
              retention-days: 1
    build-assistant:
        name: Build Assistant Docker Container
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4
          - name: Build Docker
            uses: docker/build-push-action@v7
            with:
              context: ./assistant
              platforms: linux/amd64
              push: false
              tags: homeserver-assistant:latest
              cache-from: type=gha
              cache-to: type=gha,mode=max
              outputs: type=docker,dest=${{ runner.temp }}/homeserver-assistant.tar
            env:
              DOCKER_BUILD_RECORD_UPLOAD: false
          - name: Upload artifact
            uses: actions/upload-artifact@v7
            with:
              name: homeserver-assistant
              path: ${{ runner.temp }}/homeserver-assistant.tar
              retention-days: 1
    deploy:
        name: Restart Homeserver Stack
        needs: [lint, test-assistant, test-web-unit, test-web-integration, test-web-storybook, test-web-chromatic, test-whatsapp, build-app, build-whatsapp, build-assistant]
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'        
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Download application artifact
            uses: actions/download-artifact@v8
            with:
              name: homeserver
              path: ${{ runner.temp }}
          - name: Download WhatsApp bridge artifact
            uses: actions/download-artifact@v8
            with:
              name: whatsapp-bridge
              path: ${{ runner.temp }}
          - name: Download assistant artifact
            uses: actions/download-artifact@v8
            with:
              name: homeserver-assistant
              path: ${{ runner.temp }}
          - name: Set up SSH key
            uses: webfactory/ssh-agent@v0.10.0
            with:
              ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          - name: Add Host Key to Known Hosts
            run: |
              mkdir -p ~/.ssh
              ssh-keyscan ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          - name: Sync compose, infrastructure files and images
            run: |
              rsync -avz ./infrastructure/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/homeserver/
              rsync -avz ${{ runner.temp }}/homeserver.tar ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/homeserver/
              rsync -avz ${{ runner.temp }}/whatsapp-bridge.tar ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/homeserver/
              rsync -avz ${{ runner.temp }}/homeserver-assistant.tar ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/homeserver/
          - name: Load images and restart stack
            run: |
              ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
                set -e
                cd /opt/homeserver
                docker load --input homeserver.tar
                docker load --input whatsapp-bridge.tar
                docker load --input homeserver-assistant.tar
                rm -f homeserver.tar whatsapp-bridge.tar homeserver-assistant.tar
                docker compose up -d --build --force-recreate --remove-orphans
                docker image prune -f
              EOF
          - name: Wait for stack to become healthy
            run: |
              ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
                set -e
                cd /opt/homeserver
                timeout 180s bash -c '
                  while true; do
                    bad=0
                    for cid in $(docker compose ps -q); do
                      state=$(docker inspect -f "{{.State.Status}}" "$cid")
                      health=$(docker inspect -f "{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}" "$cid")
                      if [ "$state" != "running" ]; then bad=1; break; fi
                      if [ "$health" != "none" ] && [ "$health" != "healthy" ]; then bad=1; break; fi
                    done
                    if [ "$bad" -eq 0 ]; then
                      echo "All containers are running and healthy."
                      break
                    fi
                    echo "Waiting for containers to become healthy..."
                    sleep 5
                  done
                '
              EOF
