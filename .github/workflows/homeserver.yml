name: "Homeserver"
on: 
    push:
    workflow_dispatch:
jobs:
    lint:
        name: Lint Application
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Setup
            uses: ./.github/actions/setup
          - name: Lint
            run: pnpm run lint
    test:
        name: Test Application (Unit)
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Setup
            uses: ./.github/actions/setup
          - name: Cache Playwright Browsers
            uses: actions/cache@v3
            id: playwright-cache
            with:
                path: ~/.cache/ms-playwright
                key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          - name: Install Playwright Browsers
            run: pnpm exec playwright install --with-deps
            if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
          - name: Tests
            run: pnpm run test
    chromatic:
        name: Test Application (Chromatic)
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4
            with:
               fetch-depth: 0
          - name: Setup
            uses: ./.github/actions/setup
          - name: Cache Playwright Browsers
            uses: actions/cache@v3
            id: playwright-cache
            with:
                path: ~/.cache/ms-playwright
                key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          - name: Install Playwright Browsers
            run: pnpm exec playwright install --with-deps
            if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
          - name: Chromatic
            run: pnpm run chromatic
            env:
                CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    build:
        name: Build Docker Container
        runs-on: ubuntu-latest        
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Get Git info and create .env
            run: |
              echo "GIT_COMMIT_HASH=$(git rev-parse HEAD)" >> .env
              echo "GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> .env
              echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}" >> .env
              echo "DATE_BUILT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> .env
              cat .env
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3
          - name: Build Docker
            uses: docker/build-push-action@v6
            with:
              platforms: linux/amd64
              push: false
              tags: myimage:latest
              outputs: type=docker,dest=${{ runner.temp }}/myimage.tar
          - name: Upload artifact
            uses: actions/upload-artifact@v4
            with:
              name: myimage
              path: ${{ runner.temp }}/myimage.tar
    infrastructure:
        name: Check Infrastructure
        runs-on: ubuntu-latest
        env:
            TF_CLOUD_ORGANIZATION: "gutschi-site"
            TF_API_TOKEN: "${{ secrets.TF_TOKEN }}"
            TF_WORKSPACE: "homesever-cicd"
            CONFIG_DIRECTORY: "./"
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Upload Configuration
            uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.0.0
            id: apply-upload
            with:
                directory: "./infrastructure"
                workspace: ${{ env.TF_WORKSPACE }}
          - name: Create Plan Run
            uses: hashicorp/tfc-workflows-github/actions/create-run@v1.0.0
            id: plan-run
            with:
                plan_only: true
                workspace: ${{ env.TF_WORKSPACE }}
                configuration_version: ${{ steps.apply-upload.outputs.configuration_version_id }}
          - name: Get Plan Output
            uses: hashicorp/tfc-workflows-github/actions/plan-output@v1.0.0
            id: plan-output
            with:
              plan: ${{ fromJSON(steps.plan-run.outputs.payload).data.relationships.plan.data.id }}
          - name: Check for changes
            run: |
              echo "Plan Output:"
              echo "${{ steps.plan-output.outputs.plan_output }}"
              if echo "${{ steps.plan-output.outputs.plan_output }}" | grep -q 'No changes. Infrastructure is up-to-date.'; then
                echo "No changes detected in infrastructure."
                exit 0
              else
                echo "Changes detected in infrastructure, please update manually."
                exit -1
              fi
    deploy:
        name: Push Docker Container and restart
        needs: [lint, test, chromatic, build, infrastructure]
        runs-on: ubuntu-latest        
        if: github.ref == 'refs/heads/next' && (!failure() && !cancelled())
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Login to Registry
            uses: docker/login-action@v3
            with:
              username: nologin
              password: ${{ secrets.SCW_SECRET_KEY }}
              registry: rg.fr-par.scw.cloud/funcscwgutschisitewsdlddur
          - name: Download artifact
            uses: actions/download-artifact@v4
            with:
              name: myimage
              path: ${{ runner.temp }}
          - name: Load image
            run: docker load --input ${{ runner.temp }}/myimage.tar
          - name: Tag image
            run: docker tag myimage:latest rg.fr-par.scw.cloud/funcscwgutschisitewsdlddur/www_gutschi_site:latest
          - name: Docker Push
            run: docker push  rg.fr-par.scw.cloud/funcscwgutschisitewsdlddur/www_gutschi_site:latest
