name: "Homeserver"
on: 
    push:
    workflow_dispatch:
jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Setup
            uses: ./.github/actions/setup
          - name: Lint
            run: pnpm run lint
          - name: Cache Playwright Browsers
            uses: actions/cache@v3
            id: playwright-cache
            with:
                path: ~/.cache/ms-playwright
                key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          - name: Install Playwright Browsers
            run: pnpm exec playwright install --with-deps
            working-directory: ./webcomponents
            if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
          - name: Tests
            run: pnpm run test
          - name: Chromatic
            run: pnpm run chromatic
            env:
                CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    build:
        name: Build
        needs: test
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Setup
            uses: ./.github/actions/setup
          - name: Build
            run: pnpm run build
    infrastructure:
        name: Infrastructure
        if: github.ref == 'refs/heads/main' && (!failure() && !cancelled())
        runs-on: ubuntu-latest
        env:
            TF_CLOUD_ORGANIZATION: "gutschi-site"
            TF_API_TOKEN: "${{ secrets.TF_TOKEN }}"
            TF_WORKSPACE: "homesever-cicd"
            CONFIG_DIRECTORY: "./"
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Setup
            uses: ./.github/actions/setup
          - name: Upload Configuration
            uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.0.0
            id: apply-upload
            with:
                directory: "./infrastructure"
                workspace: ${{ env.TF_WORKSPACE }}
          - name: Create Apply Run
            uses: hashicorp/tfc-workflows-github/actions/create-run@v1.0.0
            id: apply-run
            with:
                workspace: ${{ env.TF_WORKSPACE }}
                configuration_version: ${{ steps.apply-upload.outputs.configuration_version_id }}
          - name: Apply
            uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.0.0
            if: fromJSON(steps.apply-run.outputs.payload).data.attributes.actions.IsConfirmable
            id: apply
            with:
                run: ${{ steps.apply-run.outputs.run_id }}
                comment: "Apply Run from GitHub Actions CI ${{ github.sha }}"
    container:
        name: Container
        needs: [test, build, infrastructure]
        runs-on: ubuntu-latest        
        if: github.ref == 'refs/heads/main' && (!failure() && !cancelled())
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Setup
            uses: ./.github/actions/setup
          - name: Docker Build
            run: docker build --platform=linux/amd64 -t rg.fr-par.scw.cloud/funcscwgutschisitegliw2qsz/www_gutschi_site:latest .
          - name: Docker Push
            run: docker push  rg.fr-par.scw.cloud/funcscwgutschisitegliw2qsz/www_gutschi_site:latest
