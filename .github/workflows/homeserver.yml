name: "Homeserver"
on: 
    push:
    workflow_dispatch:
jobs:
    change_detection:
        name: Check for changes
        runs-on: ubuntu-latest
        outputs:
            backend: ${{ steps.compute_changes.outputs.backend }}
            frontend: ${{ steps.compute_changes.outputs.frontend }}
            webcomponents: ${{ steps.compute_changes.outputs.webcomponents }}
        steps:
          - name: Checkout
            uses: actions/checkout@v4
            with:
                fetch-depth: 0
          - uses: dorny/paths-filter@v3
            id: check_files
            with:
                filters: |
                            general:
                                - 'package.json'
                                - '.github/**'
                            backend:
                                - 'backend/**'
                            frontend:
                                - 'frontend/**'
                            webcomponents:
                                - 'webcomponents/**'
          - name: Compute change flags
            id: compute_changes
            run: |
                # Check if workflow was manually triggered
                MANUAL_TRIGGER="${{ github.event_name == 'workflow_dispatch' }}"
                
                # Get file change flags from paths-filter
                GENERAL_CHANGED="${{ steps.check_files.outputs.general }}"
                BACKEND_CHANGED="${{ steps.check_files.outputs.backend }}"
                FRONTEND_CHANGED="${{ steps.check_files.outputs.frontend }}"
                WEBCOMPONENTS_CHANGED="${{ steps.check_files.outputs.webcomponents }}"
                
                # Compute final flags (force true if manual trigger)
                if [ "$MANUAL_TRIGGER" = "true" ]; then
                    BACKEND_FLAG="true"
                    FRONTEND_FLAG="true"
                    WEBCOMPONENTS_FLAG="true"
                    echo "🚀 Manual workflow trigger detected - all components will be processed"
                else
                    # Backend: backend changes OR general changes
                    if [ "$BACKEND_CHANGED" = "true" ] || [ "$GENERAL_CHANGED" = "true" ]; then
                        BACKEND_FLAG="true"
                        echo "🔧 Backend changes detected: backend=$BACKEND_CHANGED, general=$GENERAL_CHANGED"
                    else
                        BACKEND_FLAG="false"
                        echo "✅ No backend changes detected"
                    fi
                    
                    # Frontend: frontend changes OR webcomponents changes OR general changes
                    if [ "$FRONTEND_CHANGED" = "true" ] || [ "$WEBCOMPONENTS_CHANGED" = "true" ] || [ "$GENERAL_CHANGED" = "true" ]; then
                        FRONTEND_FLAG="true"
                        echo "🎨 Frontend changes detected: frontend=$FRONTEND_CHANGED, webcomponents=$WEBCOMPONENTS_CHANGED, general=$GENERAL_CHANGED"
                    else
                        FRONTEND_FLAG="false"
                        echo "✅ No frontend changes detected"
                    fi
                    
                    # WebComponents: webcomponents changes OR general changes
                    if [ "$WEBCOMPONENTS_CHANGED" = "true" ] || [ "$GENERAL_CHANGED" = "true" ]; then
                        WEBCOMPONENTS_FLAG="true"
                        echo "⚛️ WebComponents changes detected: webcomponents=$WEBCOMPONENTS_CHANGED, general=$GENERAL_CHANGED"
                    else
                        WEBCOMPONENTS_FLAG="false"
                        echo "✅ No webcomponents changes detected"
                    fi
                fi
                
                # Set outputs
                echo "backend=$BACKEND_FLAG" >> $GITHUB_OUTPUT
                echo "frontend=$FRONTEND_FLAG" >> $GITHUB_OUTPUT
                echo "webcomponents=$WEBCOMPONENTS_FLAG" >> $GITHUB_OUTPUT                
                echo "📋 Final results: backend=$BACKEND_FLAG, frontend=$FRONTEND_FLAG, webcomponents=$WEBCOMPONENTS_FLAG"
    webcomponents_build:
        name: Build WebComponents
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Create Build Directory
            run: mkdir -p ~/webcomponents/build && mkdir -p ~/webcomponents/dist
          - name: Cache Build
            uses: actions/cache@v3
            id: webcomponents-cache
            with:
                path: |
                    webcomponents/build
                    webcomponents/dist
                key: ${{ runner.os }}-webcomponents-${{ hashFiles('webcomponents/**') }}
          - name: Setup
            if: ${{ steps.webcomponents-cache.outputs.cache-hit != 'true' }}
            uses: ./.github/actions/setup
          - name: Build
            if: ${{ steps.webcomponents-cache.outputs.cache-hit != 'true' }}
            run: pnpm -F homeserver-webcomponents run build
          - name: Upload Webcomponents Build
            uses: actions/upload-artifact@v4
            with:
                name: webcomponents-build
                path: webcomponents/build
                retention-days: 1
          - name: Upload Webcomponents Dist
            uses: actions/upload-artifact@v4
            with:
                name: webcomponents-dist
                path: webcomponents/dist
                retention-days: 1
    webcomponents_test:
        name: Test WebComponents
        runs-on: ubuntu-latest
        needs: change_detection        
        if: ${{ needs.change_detection.outputs.webcomponents == 'true' }}
        steps:
          - name: Checkout
            uses: actions/checkout@v4
            with:
               fetch-depth: 0
          - name: Setup
            uses: ./.github/actions/setup
          - name: Lint
            run: pnpm -F homeserver-webcomponents run lint
          - name: Cache Playwright Browsers
            uses: actions/cache@v3
            id: playwright-cache
            with:
                path: |
                        ~/.cache/ms-playwright
                key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          - name: Install Playwright Browsers
            run: pnpm dlx  playwright install chromium --with-deps
            if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
          - name: Tests
            run: pnpm -F homeserver-webcomponents run test
          - name: Chromatic
            run: pnpm -F homeserver-webcomponents run chromatic
            env:
                CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    frontend_build:
        name: Build Frontend
        needs: webcomponents_build
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Create Build Directory
            run: mkdir -p ~/frontend/build
          - name: Cache Build
            uses: actions/cache@v3
            id: frontend-cache
            with:
                path: frontend/build
                key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/**') }}
          - name: Setup
            if: ${{ steps.frontend-cache.outputs.cache-hit != 'true' }}
            uses: ./.github/actions/setup
          - name: Download Webcomponents Build
            if: ${{ steps.frontend-cache.outputs.cache-hit != 'true' }}
            uses: actions/download-artifact@v4
            with:
                name: webcomponents-build
                path: webcomponents/build
          - name: Download Webcomponents Dist
            if: ${{ steps.frontend-cache.outputs.cache-hit != 'true' }}
            uses: actions/download-artifact@v4
            with:
                name: webcomponents-dist
                path: webcomponents/dist
          - name: Build
            if: ${{ steps.frontend-cache.outputs.cache-hit != 'true' }}
            run: pnpm -F homeserver-frontend run build
          - name: Upload Frontend Build
            uses: actions/upload-artifact@v4
            with:
                name: frontend-build
                path: frontend/build/client
                retention-days: 1
    frontend_test:
        name: Test Frontend
        runs-on: ubuntu-latest        
        needs: change_detection        
        if: ${{ needs.change_detection.outputs.frontend == 'true' }}
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Setup
            uses: ./.github/actions/setup
          - name: Lint
            run: pnpm -F homeserver-frontend run lint
          - name: Tests
            run: pnpm -F homeserver-frontend run test
    backend_build:
        name: Build Backend
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Create Build Directory
            run: mkdir -p ~/backend/build
          - name: Cache Build
            uses: actions/cache@v3
            id: backend-cache
            with:
                path: backend/homeserver-backend.zip
                key: ${{ runner.os }}-backend-${{ hashFiles('backend/**') }}
          - name: Setup
            if: ${{ steps.backend-cache.outputs.cache-hit != 'true' }}
            uses: ./.github/actions/setup
          - name: Build
            if: ${{ steps.backend-cache.outputs.cache-hit != 'true' }}
            run: pnpm -F homeserver-backend run build
          - name: Remove non prod dependencies
            if: ${{ steps.backend-cache.outputs.cache-hit != 'true' }}
            run: pnpm i --prod -F homeserver-backend
          - name: Zip Folder
            if: ${{ steps.backend-cache.outputs.cache-hit != 'true' }}
            run: zip -r backend/homeserver-backend.zip backend
          - name: Upload Backend Build
            uses: actions/upload-artifact@v4
            with:
                name: backend-build
                path: backend/homeserver-backend.zip
                retention-days: 1
    backend_test:
        name: Test Backend
        runs-on: ubuntu-latest        
        needs: change_detection        
        if: ${{ needs.change_detection.outputs.backend == 'true' }}
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Setup
            uses: ./.github/actions/setup
          - name: Lint
            run: pnpm -F homeserver-backend run lint
          - name: Tests
            run: pnpm -F homeserver-backend run test
    deploy:
        name: Deploy
        needs:
          - change_detection
          - webcomponents_test
          - frontend_build
          - frontend_test
          - backend_build
          - backend_test
        if: github.ref == 'refs/heads/main' && (!failure() && !cancelled())
        runs-on: ubuntu-latest
        env:
            TF_CLOUD_ORGANIZATION: "gutschi-site"
            TF_API_TOKEN: "${{ secrets.TF_TOKEN }}"
            TF_WORKSPACE: "homesever-cicd"
            CONFIG_DIRECTORY: "./"
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Download Frontend Artifact
            uses: actions/download-artifact@v4
            with:
                name: frontend-build
                path: frontend/build/client
          - name: Download Backend Artifact
            uses: actions/download-artifact@v4
            with:
                name: backend-build
                path: backend
          - name: Upload Configuration
            uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.0.0
            id: apply-upload
            with:
                directory: "./"
                workspace: ${{ env.TF_WORKSPACE }}
          - name: Create Apply Run
            uses: hashicorp/tfc-workflows-github/actions/create-run@v1.0.0
            id: apply-run
            with:
                workspace: ${{ env.TF_WORKSPACE }}
                configuration_version: ${{ steps.apply-upload.outputs.configuration_version_id }}
          - name: Apply
            uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.0.0
            if: fromJSON(steps.apply-run.outputs.payload).data.attributes.actions.IsConfirmable
            id: apply
            with:
                run: ${{ steps.apply-run.outputs.run_id }}
                comment: "Apply Run from GitHub Actions CI ${{ github.sha }}"

                    