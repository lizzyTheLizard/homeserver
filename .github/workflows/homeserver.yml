name: "Homeserver"
on: 
    push:
    workflow_dispatch:
jobs:
    lint:
        name: Lint Application
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Setup
            uses: ./.github/actions/setup
          - name: Lint
            run: pnpm run lint:ci
    test:
        name: Test Application (Unit)
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Setup
            uses: ./.github/actions/setup
          - name: Cache Playwright Browsers
            uses: actions/cache@v6
            id: playwright-cache
            with:
                path: ~/.cache/ms-playwright
                key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          - name: Install Playwright Browsers
            run: pnpm exec playwright install --with-deps
            if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
          - name: Tests
            run: pnpm run test
            env:
              DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY}}
    whatsapp:
        name: Build and Test WhatsApp Bridge
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: Whatsapp
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Setup Go
            uses: actions/setup-go@v7
            with:
              go-version-file: Whatsapp/go.mod
              cache-dependency-path: Whatsapp/go.sum
          - name: Build
            run: go build ./...
          - name: Vet
            run: go vet ./...
          - name: Test
            run: go test ./...
    chromatic:
        name: Test Application (Chromatic)
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v7
            with:
               fetch-depth: 0
          - name: Setup
            uses: ./.github/actions/setup
          - name: Run Chromatic
            uses: chromaui/action@latest
            with:
              projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
              autoAcceptChanges: main
              exitZeroOnChanges: false
    build:
        name: Build Docker Container
        runs-on: ubuntu-latest        
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4
          - name: Get Datetime
            run: echo "datetime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
            id: get-datetime
          - name: Set Environment Variables (Prod)
            if : github.ref == 'refs/heads/main'
            run: echo "container_tag=latest" >> $GITHUB_ENV
          - name: Set Environment Variables (Test)
            if : github.ref != 'refs/heads/main'
            run: echo "container_tag=test" >> $GITHUB_ENV
          - name: Build Docker
            uses: docker/build-push-action@v7
            with:
              context: .
              platforms: linux/amd64
              push: false
              tags: homeserver:${{ env.container_tag }}
              cache-from: type=gha
              cache-to: type=gha,mode=max 
              outputs: type=docker,dest=${{ runner.temp }}/homeserver.tar
              build-args: |
                GIT_COMMIT_HASH=${{ github.sha }}
                GIT_BRANCH=${{ github.ref_name }}
                GITHUB_RUN_ID=${{ github.run_id }}
                BUILD_TIME=${{ steps.get-datetime.outputs.datetime }}
            env:
              DOCKER_BUILD_RECORD_UPLOAD: false
          - name: Upload artifact
            uses: actions/upload-artifact@v7
            with:
              name: homeserver
              path: ${{ runner.temp }}/homeserver.tar
              retention-days: 5
    deploy:
        name: Restart Homeserver Stack
        needs: [lint, test, whatsapp, chromatic, build]
        runs-on: ubuntu-latest
        if: github.actor != 'dependabot[bot]'        
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Download artifact
            uses: actions/download-artifact@v8
            with:
              name: homeserver
              path: ${{ runner.temp }}
          - name: Set up SSH key
            uses: webfactory/ssh-agent@v0.10.0
            with:
              ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          - name: Add Host Key to Known Hosts
            run: |
              mkdir -p ~/.ssh
              ssh-keyscan ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          - name: Sync compose, infrastructure files and image
            run: |
              rsync -avz ./infrastructure/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/homeserver/
              rsync -avz ${{ runner.temp }}/homeserver.tar ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/homeserver/
          - name: Load image and restart stack
            run: |
              ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
                set -e
                cd /opt/homeserver
                docker load --input homeserver.tar
                rm homeserver.tar
                # latest must exist (on branch deploys it comes from a previous main deploy), otherwise fail
                docker image inspect homeserver:latest > /dev/null
                # test falls back to latest if it does not exist yet
                docker image inspect homeserver:test > /dev/null 2>&1 || docker tag homeserver:latest homeserver:test
                docker compose up -d --remove-orphans
                docker image prune -f
              EOF