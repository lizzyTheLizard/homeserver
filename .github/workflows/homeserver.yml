name: "Homeserver"
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  change-guard:
    name: Change guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      - name: Check the pull request carries an archived change
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/change-guard.mjs
  integration-smoke:
    name: Integration Smoke (docker-compose stack)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      - name: Setup
        uses: ./.github/actions/setup
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull changed service images
        run: |
          branch="$(echo "${{ github.head_ref }}" | tr '/' '-')"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD || true)"
          infra="false"
          if echo "$changed" | grep -qE '^infrastructure/'; then
            infra="true"
          fi
          for svc in web assistant whatsapp wichteln dev-machine; do
            if [ "$infra" = "true" ] || echo "$changed" | grep -qE "^services/$svc/"; then
              img="ghcr.io/lizzythelizard/homeserver-$svc"
              for i in $(seq 1 30); do
                if docker pull "$img:$branch" 2>/dev/null; then
                  docker tag "$img:$branch" "$img:latest"
                  echo "Using $img:$branch"
                  break
                fi
                sleep 10
              done
            fi
          done
      - name: Cache third-party Docker images
        uses: actions/cache@v6
        id: third-party-images
        with:
          path: ${{ runner.temp }}/third-party-images
          key: third-party-images-${{ hashFiles('infrastructure/docker-compose.yml', 'integration-test/docker-compose.ci.yml') }}
      - name: Load cached third-party Docker images
        if: ${{ steps.third-party-images.outputs.cache-hit == 'true' }}
        run: |
          for f in ${{ runner.temp }}/third-party-images/*.tar; do
            [ -f "$f" ] && docker load --input "$f" || true
          done
      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright Browsers
        run: pnpm --filter @homeserver/integration-test exec playwright install --with-deps chromium
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
      - name: Map smoke hosts to localhost
        run: |
          sudo tee -a /etc/hosts > /dev/null << 'EOF'
          127.0.0.1 dev.gutschi.site
          127.0.0.1 www.gutschi.site
          127.0.0.1 logs.gutschi.site
          127.0.0.1 wichteln.gutschi.site
          127.0.0.1 mock-oidc-server
          EOF
      - name: Generate self-signed certificates
        run: pnpm --filter @homeserver/integration-test certs
      - name: Create project .env for compose interpolation
        run: |
          if [ ! -f infrastructure/.env ]; then
            cp integration-test/env.test infrastructure/.env
          fi
      - name: Start smoke stack
        run: docker compose -f infrastructure/docker-compose.yml -f integration-test/docker-compose.ci.yml up -d --wait --wait-timeout 300 --remove-orphans
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
      - name: Save third-party Docker images for cache
        if: ${{ steps.third-party-images.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "${{ runner.temp }}/third-party-images"
          for img in nginx:alpine postgres:16-alpine sosedoff/pgweb amir20/dozzle:latest caddy:2-alpine ubuntu/bind9:latest certbot/certbot:latest node:24-alpine; do
            if docker image inspect "$img" >/dev/null 2>&1; then
              docker save "$img" --output "${{ runner.temp }}/third-party-images/$(echo "$img" | tr '/:' '__').tar"
            fi
          done
      - name: Run smoke checks
        run: pnpm --filter @homeserver/integration-test test
      - name: Dump smoke stack logs
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yml -f integration-test/docker-compose.ci.yml logs --no-color --timestamps
      - name: Tear down smoke stack
        if: always()
        run: docker compose -f infrastructure/docker-compose.yml -f integration-test/docker-compose.ci.yml down --remove-orphans -v
  all-checks:
    name: All Build Check Success
    runs-on: ubuntu-latest
    needs: [integration-smoke]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: All checks passed
        run: echo "All build and integration smoke checks passed."
