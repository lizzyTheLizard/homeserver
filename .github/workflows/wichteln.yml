name: "Wichteln"
on:
  pull_request:
    paths:
      - 'services/wichteln/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - 'services/wichteln/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'infrastructure/**'
  workflow_dispatch:
jobs:
  lint:
    name: Lint Wichteln
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/wichteln
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: pnpm run lint:ci
  test:
    name: Test Wichteln
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/wichteln
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Tests
        run: pnpm test
  build:
    name: Build and publish Wichteln image
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and publish
        uses: ./.github/actions/build-publish
        with:
          image: homeserver-wichteln
          dockerfile: services/wichteln/Dockerfile
  deploy:
    name: Deploy Wichteln
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Deploy service
        uses: ./.github/actions/deploy-service
        with:
          service: wichteln
