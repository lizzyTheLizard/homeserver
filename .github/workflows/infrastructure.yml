name: "Infrastructure"
on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Deploy infrastructure
        uses: ./.github/actions/deploy-infrastructure
