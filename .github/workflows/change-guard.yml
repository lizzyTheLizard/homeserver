name: "Change guard"
on:
    pull_request:
        types: [opened, synchronize, reopened]
jobs:
    change-guard:
        name: Change guard
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v7
            with:
              fetch-depth: 0
          - name: Check branch matches change
            env:
              HEAD_REF: ${{ github.head_ref }}
              BASE_REF: origin/${{ github.base_ref }}
            run: node scripts/change-guard.mjs
