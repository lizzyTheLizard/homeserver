name: "Build and Test"
on: push
jobs:
  webcomponents:
    name: Run Web Components Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Read nvmrc file
        run: echo ::set-output name=NVMRC::$(cat .nvmrc)
        id: nvm
      - name: Setup node
        uses: actions/setup-node@v1
        with:
          node-version: '${{ steps.nvm.outputs.NVMRC }}'
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps 
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        working-directory: ./webcomponents
        run: pnpm i
      - name: Build
        working-directory: ./webcomponents
        run: pnpm build
      - name: Lint
        working-directory: ./webcomponents
        run: pnpm lint
      - name: Run tests
        working-directory: ./webcomponents
        run: pnpm test
      - name: Run Chromatic
        working-directory: ./webcomponents
        run: pnpm chromatic
