name: "Build and Test"
on: push
jobs:
  webcomponents:
    name: Build and Test Webcomponents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Read nvmrc file
        run: echo ::set-output name=NVMRC::$(cat .nvmrc)
        id: nvm
      - name: Setup node
        uses: actions/setup-node@v1
        with:
          node-version: '${{ steps.nvm.outputs.NVMRC }}'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm i
      - name: Build
        run: pnpm -F homeserver-webcomponents run build
      - name: Lint
        run: pnpm -F homeserver-webcomponents lint
      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps 
      - name: Run Chromatic
        run: pnpm -F homeserver-webcomponents chromatic
      - name: Run tests
        run: pnpm -F homeserver-webcomponents test
      - name: Run Chromatic
        run: pnpm -F homeserver-webcomponents chromatic
