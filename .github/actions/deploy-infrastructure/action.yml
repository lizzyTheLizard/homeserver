name: Deploy infrastructure
description: Sync infrastructure files and recreate the whole compose stack on the host (only on a push to main)
inputs:
  ssh-private-key:
    description: SSH private key for the host
    required: true
  ssh-host:
    description: SSH host to deploy to
    required: true
  ssh-user:
    description: SSH user on the host
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up SSH key
      if: ${{ github.event_name == 'push' }}
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}
    - name: Add host key to known hosts
      if: ${{ github.event_name == 'push' }}
      shell: bash
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan ${{ inputs.ssh-host }} >> ~/.ssh/known_hosts
    - name: Sync infrastructure files
      if: ${{ github.event_name == 'push' }}
      shell: bash
      run: |
        rsync -avz ./infrastructure/ ${{ inputs.ssh-user }}@${{ inputs.ssh-host }}:/opt/homeserver/
    - name: Pull and recreate the whole stack
      if: ${{ github.event_name == 'push' }}
      shell: bash
      # Serialize deploys on the host: parallel workflows racing on pull/prune break each other's image leases
      run: |
        ssh ${{ inputs.ssh-user }}@${{ inputs.ssh-host }} "flock -w 900 /tmp/homeserver-deploy.lock sh -c 'set -e; cd /opt/homeserver; docker compose pull; docker compose up -d --force-recreate --remove-orphans; docker image prune -f'"
