name: Setup
description: Setup the environment for the project
runs:
  using: "composite"
  steps:
  - name: Read nvmrc file
    id: nvm
    shell: bash
    run: echo "NVMRC=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
  - name: Setup node
    uses: pnpm/setup@v1
    with:
      runtime: node@${{ steps.nvm.outputs.NVMRC }}
      cache: true
  - name: Install dependencies
    run: pnpm install --frozen-lockfile
    shell: bash
