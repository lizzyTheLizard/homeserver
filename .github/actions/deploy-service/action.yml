name: Deploy service
description: Pull a service's GHCR image and recreate its container on the host (only on a push to main)
inputs:
  service:
    description: The compose service name (applicationprod, assistant, whatsapp, wichteln, dev-machine)
    required: true
  ssh-private-key:
    description: SSH private key for the host
    required: true
  ssh-host:
    description: SSH host to deploy to
    required: true
  ssh-user:
    description: SSH user on the host
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up SSH key
      if: ${{ github.event_name == 'push' }}
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}
    - name: Add host key to known hosts
      if: ${{ github.event_name == 'push' }}
      shell: bash
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan ${{ inputs.ssh-host }} >> ~/.ssh/known_hosts
    - name: Sync infrastructure files
      if: ${{ github.event_name == 'push' }}
      shell: bash
      run: |
        rsync -avz ./infrastructure/ ${{ inputs.ssh-user }}@${{ inputs.ssh-host }}:/opt/homeserver/
    - name: Pull image and recreate the service
      if: ${{ github.event_name == 'push' }}
      shell: bash
      run: |
        ssh ${{ inputs.ssh-user }}@${{ inputs.ssh-host }} "set -e; cd /opt/homeserver; docker compose pull ${{ inputs.service }}; docker compose up -d --force-recreate --remove-orphans ${{ inputs.service }}; docker image prune -f"
