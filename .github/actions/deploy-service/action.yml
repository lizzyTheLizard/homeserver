name: Deploy service
description: Pull a service's GHCR image and recreate its container on the host
inputs:
  service:
    description: The compose service name (applicationprod, assistant, whatsapp, wichteln, dev-machine)
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up SSH key
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    - name: Add host key to known hosts
      shell: bash
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
    - name: Sync infrastructure files
      shell: bash
      run: |
        rsync -avz ./infrastructure/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/homeserver/
    - name: Pull image and recreate the service
      shell: bash
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "set -e; cd /opt/homeserver; docker compose pull ${{ inputs.service }}; docker compose up -d --force-recreate --remove-orphans ${{ inputs.service }}; docker image prune -f"
