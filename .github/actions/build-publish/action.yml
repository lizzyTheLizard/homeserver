name: Build and publish service image
description: Build a service image and publish it to GHCR on main
inputs:
  image:
    description: Image name without the ghcr.io/lizzythelizard/ prefix (e.g. homeserver-web)
    required: true
  dockerfile:
    description: Path to the service's Dockerfile relative to the repository root
    required: true
  build-args:
    description: Newline-separated build arguments
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: ghcr.io/lizzythelizard/${{ inputs.image }}:latest
        cache-from: type=gha,scope=${{ inputs.image }}
        cache-to: type=gha,mode=min,scope=${{ inputs.image }}
        build-args: ${{ inputs.build-args }}
