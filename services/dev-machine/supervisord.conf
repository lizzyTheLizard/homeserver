[unix_http_server]
file=/home/dev/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///home/dev/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
user=dev
logfile=/home/dev/supervisord.log
pidfile=/home/dev/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D -e -h /home/dev/.ssh/id_sshd
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:code-server]
command=code-server --bind-addr 0.0.0.0:8080 --auth none /home/dev/workspace
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:claude-remote-control]
command=claude remote-control --spawn worktree
directory=/home/dev/workspace
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

