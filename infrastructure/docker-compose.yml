services:
  postgresprod:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homeserver
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD}
      POSTGRES_DB: homeserver
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeserver -d homeserver"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgrestest:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homeserver
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD}
      POSTGRES_DB: homeserver
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeserver -d homeserver"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  applicationprod:
    image: mytest:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_URL: https://www-devserver.gutschi.site
      DB_CONNECTION_STRING: postgres://homeserver:${PROD_DB_PASSWORD}@postgresprod:5432/homeserver?sslmode=disable
    depends_on:
      postgresprod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://applicationprod:3000/api/ping',function(r){process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  applicationtest:
    image: mytest:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_URL: https://test.gutschi.site
      DB_CONNECTION_STRING: postgres://homeserver:${TEST_DB_PASSWORD}@postgrestest:5432/homeserver?sslmode=disable
    depends_on:
      postgrestest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://applicationtest:3000/api/ping',function(r){process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  pgwebprod:
    image: sosedoff/pgweb
    restart: unless-stopped
    command: --bind=0.0.0.0 --listen=8081
    environment:
      DATABASE_URL: postgres://homeserver:${PROD_DB_PASSWORD}@postgresprod:5432/homeserver?sslmode=disable
    depends_on:
      postgresprod:
        condition: service_healthy

  pgwebtest:
    image: sosedoff/pgweb
    restart: unless-stopped
    command: --bind=0.0.0.0 --listen=8081
    environment:
      DATABASE_URL: postgres://homeserver:${TEST_DB_PASSWORD}@postgrestest:5432/homeserver?sslmode=disable
    depends_on:
      postgrestest:
        condition: service_healthy

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export ADMIN_PASSWORD_HASH=$$(caddy hash-password --plaintext "$$ADMIN_PASSWORD")
        caddy run --config /etc/caddy/Caddyfile
    depends_on:
      - dozzle
      - pgwebprod
      - pgwebtest
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      applicationprod:
        condition: service_healthy
      applicationtest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_prod_data:
  postgres_test_data:
