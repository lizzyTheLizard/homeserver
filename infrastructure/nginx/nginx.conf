resolver 127.0.0.11 valid=30s;

# Shared proxy settings
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

# Custom log format that captures connection ID, request counts, and execution time
log_format detailed_conn '$remote_addr:$remote_port - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         'conn_id=$connection conn_reqs=$connection_requests '
                         'req_time=$request_time http_host="$host"';

# Send access logs directly to stdout so Docker captures them
access_log /dev/stdout detailed_conn;

# Set error_log to 'info' to log connection lifecycle events (SSL handshakes, connects/disconnects)
# Use 'debug' for maximum internal Nginx logging
error_log /dev/stderr info;

server {
    listen 80;
    server_name dev.gutschi.site logs.gutschi.site www.gutschi.site;

    # ACME Challenge location for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /health {
        return 200 "ok";
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
  listen 443 ssl http2;
  ssl_certificate /etc/letsencrypt/live/dev.gutschi.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dev.gutschi.site/privkey.pem;
  server_name dev.gutschi.site;

  location /ws/assistant {
    proxy_pass http://dev-machine:8500;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  location / {
    proxy_pass http://dev-machine:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 8443 ssl http2;
  ssl_certificate /etc/letsencrypt/live/dev.gutschi.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dev.gutschi.site/privkey.pem;
  server_name dev.gutschi.site;


  location / {
    proxy_pass http://caddy:8443;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;
    proxy_set_header Accept-Encoding gzip;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Prevents Nginx from dropping idle WebSocket connections after 60 seconds
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }
}
